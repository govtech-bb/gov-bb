name: Landing v2 Parity

# Proves landing pages served from api_v2 render like the static markdown
# (#3304, #3853): after each Deploy Sandbox run that deployed landing or
# api_v2, sandbox landing (sandbox.alpha.gov.bb, deployed from main) is
# compared with the static baseline:
#  - crawl: every sitemap URL is compared (#3141; allowlist in
#    apps/landing/e2e/parity/allowlist.json);
#  - visual: one page per template is screenshotted on both at 390px and
#    1280px and compared (#3142); diffs are uploaded on failure.
# Deploy Sandbox already waits for the sandbox Amplify build, so this
# workflow does not.
#
# The gate job skips both checks with a notice, and stays green, when the
# Deploy Sandbox run failed or deployed neither landing nor api_v2, or when
# sandbox landing does not serve api_v2 pages (before #3311). A manual run
# skips only for the last reason.
#
# Static baseline (decided on #3853): staging.alpha.gov.bb, static until the
# staging switch (#3227). At #3227, STATIC_BASE_URL moves to prod
# (alpha.gov.bb, static until the prod switch on 2 Dec). At the prod switch
# no static baseline is left, and this workflow is retired.

on:
  # Deploy Sandbox runs only on a push to main or by hand, and this workflow
  # checks out main, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Sandbox]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-v2-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  V2_BASE_URL: https://sandbox.alpha.gov.bb
  STATIC_BASE_URL: https://staging.alpha.gov.bb
  CATALOG_URL: https://api.sandbox.alpha.gov.bb/v2/catalog

jobs:
  gate:
    name: Check sandbox landing serves api_v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read the triggering Deploy Sandbox run's jobs
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = workflow_run ]; then
            [ "$CONCLUSION" = success ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID concluded '$CONCLUSION', not success."
            # A reusable workflow's jobs are named "Deploy api_v2 / <job>".
            deployed="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success") | select(.name == "Amplify build (landing)" or (.name | startswith("Deploy api_v2"))) | .name')"
            [ -n "$deployed" ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID deployed neither landing nor api_v2."
          fi
          # Up to 5 public api_v2 pages; one served from api_v2 is enough.
          paths="$(curl -fsS --max-time 30 "$CATALOG_URL" |
            jq -r '[.pages[] | select(.visibility == "public") | .url][:5][]')"
          for path in $paths; do
            source="$(curl -sS -o /dev/null -D - --max-time 30 \
              "$V2_BASE_URL$path?parity-gate=$GITHUB_RUN_ID-$RANDOM" |
              tr -d '\r' | awk -F': ' 'tolower($1) == "x-content-source" { print $2 }' || true)"
            echo "$path: x-content-source ${source:-(none)}"
            if [ "$source" = api_v2 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          skip "Skipped: sandbox landing serves static content, not api_v2 yet (#3311)."

  crawl:
    name: Crawl and compare with static
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        run: pnpm --filter @govtech-bb/landing parity:crawl

  visual:
    name: Visual regression per template
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @govtech-bb/landing exec playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "could not resolve playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # No --with-deps (see forms-a11y.yml, #2291): ubuntu-latest already
        # ships chromium's shared libraries.
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/landing exec playwright install chromium
      - name: Compare screenshots
        run: pnpm --filter @govtech-bb/landing parity:visual
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-v2-visual-diffs
          path: apps/landing/test-results/
          retention-days: 14
