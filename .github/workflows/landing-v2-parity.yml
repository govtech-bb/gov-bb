name: Landing v2 Parity

# Proves landing pages served from api_v2 render like the static markdown
# (#3304, #3853): after each Deploy Sandbox run that deployed landing or
# api_v2, sandbox landing (sandbox.alpha.gov.bb, deployed from main) is
# compared with the static baseline:
#  - crawl: every sitemap URL is compared (#3141; allowlist in
#    apps/landing/e2e/parity/allowlist.json);
#  - visual: one page per template is screenshotted on both at 390px and
#    1280px and compared (#3142); diffs are uploaded on failure.
# Deploy Sandbox already waits for the sandbox Amplify build, so this
# workflow does not.
#
# The gate job decides whether the checks run. On a Deploy Sandbox
# completion it skips green, with a notice, when that run did not succeed,
# when it deployed neither landing nor api_v2, or when a newer Deploy Sandbox
# run on main is queued or in progress: the checks would crawl a sandbox that
# is mid-deploy, and the newer run's completion re-runs them. Caveat: if that
# newer run deploys neither landing nor api_v2, its gate skips too, so the
# check waits for the next landing or api_v2 deploy.
#
# On any trigger, the gate then asks sandbox landing for up to 5 public
# catalog pages (landing's feature routes, src/routes/**/-meta.ts, are left
# out: landing renders them itself with no x-content-source). It skips green
# only when a page answers `x-content-source: static` and none answers from
# api_v2 (before #3311). An api_v2 answer runs the checks; so do
# `api_v2-stale` and `static-fallback` (landing reads api_v2 but api_v2
# failed). Every other case (no header, 5xx, timeout, landing unreachable, no
# public pages) also runs them, with a warning naming the case, so a broken
# landing goes red instead of skipping. A catalog that can't be read fails
# the gate.
#
# Static baseline (decided on #3853): staging.alpha.gov.bb, static until the
# staging switch (#3227). At #3227, STATIC_BASE_URL moves to prod
# (alpha.gov.bb, static until the prod switch on 2 Dec). At the prod switch
# no static baseline is left, and this workflow is retired.

on:
  # Deploy Sandbox runs only on a push to main or by hand, and this workflow
  # checks out main, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Sandbox]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  V2_BASE_URL: https://sandbox.alpha.gov.bb
  STATIC_BASE_URL: https://staging.alpha.gov.bb
  CATALOG_URL: https://api.sandbox.alpha.gov.bb/v2/catalog

jobs:
  gate:
    name: Check sandbox landing serves api_v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read Deploy Sandbox runs and their jobs
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout landing routes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: apps/landing/src/routes
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          run_checks() {
            [ -z "${1:-}" ] || echo "::warning::$1"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = workflow_run ]; then
            [ "$CONCLUSION" = success ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID concluded '$CONCLUSION', not success."
            # A reusable workflow's jobs are named "Deploy api_v2 / <job>".
            deployed="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success") | select(.name == "Amplify build (landing)" or (.name | startswith("Deploy api_v2"))) | .name')"
            [ -n "$deployed" ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID deployed neither landing nor api_v2."
            newer="$(gh api "repos/$REPO/actions/workflows/deploy-sandbox.yml/runs?branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.id > $RUN_ID and .status != \"completed\")] | length")"
            [ "$newer" = 0 ] ||
              skip "Skipped: a newer Deploy Sandbox run is deploying; its completion re-runs this check."
          fi
          # Feature routes carry no x-content-source, so they prove nothing.
          features="$(find apps/landing/src/routes -name '-meta.ts' |
            sed -e 's#^apps/landing/src/routes##' -e 's#/-meta\.ts$##' | jq -R . | jq -s .)"
          paths="$(curl -fsS --max-time 30 "$CATALOG_URL" |
            jq -r --argjson features "$features" \
              '[.pages[] | select(.visibility == "public") | .url | select(IN($features[]) | not)][:5][]')" || {
            echo "::error::Could not list public pages from $CATALOG_URL."
            exit 1
          }
          [ -n "$paths" ] ||
            run_checks "$CATALOG_URL lists no public pages besides feature routes; running the checks."
          headers="$(mktemp)"
          api_v2=false
          static=false
          for path in $paths; do
            rc=0
            status="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 30 \
              "$V2_BASE_URL$path?parity-gate=$GITHUB_RUN_ID-$RANDOM")" || rc=$?
            if [ "$rc" = 28 ]; then
              echo "::warning::$path: sandbox landing timed out."
              continue
            elif [ "$rc" != 0 ]; then
              echo "::warning::$path: sandbox landing unreachable (curl exit $rc)."
              continue
            fi
            source="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1) == "x-content-source" { print $2 }')"
            echo "$path: HTTP $status, x-content-source ${source:-(none)}"
            if [[ "$source" =~ ^(api_v2|api_v2-stale|static-fallback)$ ]]; then
              api_v2=true
            elif [ "$source" = static ]; then
              static=true
            elif [ "$status" -ge 500 ]; then
              echo "::warning::$path: sandbox landing answered HTTP $status."
            else
              echo "::warning::$path: sandbox landing answered HTTP $status with no x-content-source."
            fi
          done
          [ "$api_v2" = true ] && run_checks
          [ "$static" = true ] &&
            skip "Skipped: sandbox landing serves static content, not api_v2 yet (#3311)."
          run_checks "No sampled page answered static or api_v2; running the checks."

  crawl:
    name: Crawl and compare with static
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Job-level, so only a run that passed the gate cancels an older check: a
    # skipped run must not cancel a real one (every workflow_run is on main).
    concurrency:
      group: landing-v2-parity-crawl-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        run: pnpm --filter @govtech-bb/landing parity:crawl

  visual:
    name: Visual regression per template
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: landing-v2-parity-visual-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @govtech-bb/landing exec playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "could not resolve playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # No --with-deps (see forms-a11y.yml, #2291): ubuntu-latest already
        # ships chromium's shared libraries.
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/landing exec playwright install chromium
      - name: Compare screenshots
        run: pnpm --filter @govtech-bb/landing parity:visual
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-v2-visual-diffs
          path: apps/landing/test-results/
          retention-days: 14
