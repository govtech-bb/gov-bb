name: CI

on:
  pull_request:
    branches: [main, sandbox, staging, dev]
  # Re-validate the trunk after every merge. CI otherwise runs only on
  # pull_request, so a break that emerges from the COMBINATION of two
  # independently-green PRs (e.g. #1875's recipes + #1970's new lint, incident
  # #2017) isn't caught until the next PR happens to open. A post-merge run on
  # `main` flags a red trunk immediately. `validate-recipes` matters most here:
  # it validates ALL recipes, not just nx-affected ones.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Latest push wins — cancel superseded in-progress runs. On `main` this means
# rapid merges leave only the newest tip fully validated, which is exactly the
# "is the trunk red right now" signal we want. Safe because CI has no side
# effects (pull_request / push-to-main / workflow_dispatch only, no deploys).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # Fails on dependency-version drift across workspace packages.
      # Deliberate splits (express 4/5, forms' eslint 9, react-markdown 9/10)
      # are ignored via flags in the script — see root package.json.
      # @govtech-bb/react is split while apps move to the new design system one
      # at a time: landing is on alpha.25, analytics still on alpha.17. Drop the
      # flag once every app has migrated.
      - name: Dependency consistency (sherif)
        run: pnpm lint:deps

      - name: Run type check (tsc --build)
        id: typecheck
        run: |
          pnpm exec tsc -b 2>&1 | tee typecheck-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report type check results
        if: steps.typecheck.outcome == 'failure'
        run: |
          ERROR_COUNT=$(grep -c "error TS" typecheck-output.txt 2>/dev/null || echo "?")

          echo "## ❌ Type Check Failed — ${ERROR_COUNT} error(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>View type errors</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat typecheck-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm exec tsc -b" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan current commit for secrets
        id: gitleaks_current
        run: |
          gitleaks detect --source . --verbose --config .gitleaks.toml --report-format json --report-path gitleaks-current.json 2>&1 | tee gitleaks-current-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Fetch full history and scan if secrets found
        id: gitleaks_history
        if: steps.gitleaks_current.outcome == 'failure'
        run: |
          echo "Secrets found in current commit. Checking git history for similar secrets..."
          git fetch --unshallow || git fetch --depth=1000
          gitleaks detect --source . --verbose --config .gitleaks.toml --report-format json --report-path gitleaks-history.json 2>&1 | tee gitleaks-history-output.txt || true
        continue-on-error: true

      - name: Analyze and report secrets
        if: steps.gitleaks_current.outcome == 'failure'
        run: |
          python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          import os

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          sha = os.environ.get('GITHUB_SHA', '')

          try:
              with open('gitleaks-current.json', 'r') as f:
                  current_data = json.load(f)
          except:
              current_data = []

          try:
              with open('gitleaks-history.json', 'r') as f:
                  history_data = json.load(f)
          except:
              history_data = []

          current_secrets = []
          historical_secrets = []

          current_files = set()
          for finding in current_data:
              file = finding.get('File', 'Unknown')
              current_files.add(file)
              if os.path.exists(file):
                  current_secrets.append(finding)

          for finding in history_data:
              file = finding.get('File', 'Unknown')
              if file not in current_files or not os.path.exists(file):
                  historical_secrets.append(finding)

          print("## 🚨 Secrets Detected")
          print("")

          if current_secrets:
              print(f"### ⛔ Current Commit: {len(current_secrets)} secret(s) - BUILD BLOCKED")
              print("")
              print("**These secrets are in your current changes and must be fixed:**")
              print("")

              for i, finding in enumerate(current_secrets, 1):
                  file = finding.get('File', 'Unknown')
                  line = finding.get('StartLine', 'Unknown')
                  rule = finding.get('RuleID', 'Unknown')
                  match = finding.get('Match', '')
                  secret = finding.get('Secret', '')

                  if secret and len(secret) > 8:
                      masked = secret[:4] + '*' * (len(secret) - 8) + secret[-4:]
                  else:
                      masked = '*' * len(secret) if secret else 'N/A'

                  print(f"**{i}. {rule}**")
                  print(f"- **Location**: `{file}` (line {line})")

                  if repo and sha and file != 'Unknown':
                      file_url = f"https://github.com/{repo}/blob/{sha}/{file}#L{line}"
                      print(f"- **View file**: [{file}:{line}]({file_url})")

                  print(f"- **Match**: `{match[:100]}...`" if len(match) > 100 else f"- **Match**: `{match}`")
                  print(f"- **Secret**: `{masked}`")
                  print("")

          if historical_secrets:
              print("")
              print("---")
              print("")
              print(f"### ⚠️ Git History: {len(historical_secrets)} secret(s) found - WARNING ONLY")
              print("")
              print("<details><summary>Click to view historical secrets</summary>")
              print("")

              for i, finding in enumerate(historical_secrets[:20], 1):
                  file = finding.get('File', 'Unknown')
                  line = finding.get('StartLine', 'Unknown')
                  rule = finding.get('RuleID', 'Unknown')
                  secret = finding.get('Secret', '')
                  commit = finding.get('Commit', '')

                  if secret and len(secret) > 8:
                      masked = secret[:4] + '*' * (len(secret) - 8) + secret[-4:]
                  else:
                      masked = '*' * len(secret) if secret else 'N/A'

                  print(f"**{i}. {rule}**")
                  print(f"- **Location**: `{file}` (line {line})")
                  if commit:
                      print(f"- **Commit**: `{commit[:8]}`")
                  print(f"- **Secret**: `{masked}`")
                  print("")

              if len(historical_secrets) > 20:
                  print(f"*...and {len(historical_secrets) - 20} more historical secret(s)*")

              print("</details>")
              print("")
              print("💡 **Recommendation**: These secrets should be rotated if they were real credentials.")

          print("")
          print("---")
          print("")
          print("## 🔧 How to Fix")
          print("")
          print("- Use environment variables: `process.env.MY_SECRET`")
          print("- Use placeholder values: `'your-api-key-here'`")
          print("- Create `.env.example` with safe defaults")
          print("")

          EOF

          exit 1

  security:
    name: Security Scan
    # Skip CodeQL on staging-bound PRs: same code already scanned on the
    # upstream sandbox PR. Staging is a promotion gate, not a new-code gate.
    if: github.base_ref != 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          output: sarif-results
          upload: false
        continue-on-error: true

      - name: Parse and report security results
        if: always()
        run: |
          SARIF_FILE=$(find sarif-results -name "*.sarif" -type f | head -n 1)

          if [ -z "$SARIF_FILE" ]; then
            echo "## ✅ Security Scan Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No SARIF results file found. CodeQL analysis may still be processing." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          import os
          import glob
          import sys

          sarif_files = glob.glob('sarif-results/**/*.sarif', recursive=True)
          if not sarif_files:
              print("## ✅ Security Scan Complete")
              print("")
              print("No security issues detected by CodeQL.")
              sys.exit(0)

          sarif_file = sarif_files[0]

          try:
              with open(sarif_file, 'r') as f:
                  sarif = json.load(f)

              all_results = []

              for run in sarif.get('runs', []):
                  results = run.get('results', [])
                  rules = {r['id']: r for r in run.get('tool', {}).get('driver', {}).get('rules', [])}

                  for result in results:
                      rule_id = result.get('ruleId', 'Unknown')
                      rule = rules.get(rule_id, {})

                      level = result.get('level', 'warning')
                      message = result.get('message', {}).get('text', 'No description')

                      properties = result.get('properties', {})
                      security_severity = properties.get('security-severity', '')
                      kind = properties.get('kind', '')
                      precision = properties.get('precision', '')
                      tags = properties.get('tags', [])

                      if not security_severity and rule:
                          rule_properties = rule.get('properties', {})
                          security_severity = rule_properties.get('security-severity', '')
                          if not tags:
                              tags = rule_properties.get('tags', [])

                      if security_severity:
                          try:
                              score = float(security_severity)
                              if score >= 9.0:
                                  severity_label = 'Critical'
                              elif score >= 7.0:
                                  severity_label = 'High'
                              elif score >= 4.0:
                                  severity_label = 'Medium'
                              else:
                                  severity_label = 'Low'
                          except:
                              severity_label = 'Unknown'
                      else:
                          has_security_tag = any('security' in str(t).lower() for t in tags)
                          has_external_tag = any('external' in str(t).lower() for t in tags)
                          if level == 'error':
                              severity_label = 'High'
                          elif level == 'warning':
                              if has_security_tag or 'security' in kind.lower() or 'path-problem' in kind.lower():
                                  severity_label = 'High' if precision in ['high', 'very-high'] or has_external_tag else 'Medium'
                              else:
                                  severity_label = 'Medium'
                          elif level == 'note':
                              severity_label = 'Low'
                          else:
                              severity_label = 'Unknown'

                      locations = result.get('locations', [])
                      if locations:
                          loc = locations[0].get('physicalLocation', {})
                          file = loc.get('artifactLocation', {}).get('uri', 'Unknown')
                          region = loc.get('region', {})
                          line = region.get('startLine', 'Unknown')
                      else:
                          file = 'Unknown'
                          line = 'Unknown'

                      fix_recommendation = None
                      rule_help_uri = None
                      if rule:
                          rule_help_uri = rule.get('helpUri', '')
                          help_text = rule.get('help', {})
                          if isinstance(help_text, dict):
                              fix_recommendation = help_text.get('text', '')
                          elif isinstance(help_text, str):
                              fix_recommendation = help_text
                          if not fix_recommendation:
                              full_desc = rule.get('fullDescription', {})
                              if isinstance(full_desc, dict):
                                  fix_recommendation = full_desc.get('text', '')

                      all_results.append({
                          'rule_id': rule_id,
                          'severity': severity_label,
                          'message': message,
                          'file': file,
                          'line': line,
                          'rule_name': rule.get('shortDescription', {}).get('text', rule_id),
                          'fix': fix_recommendation,
                          'help_uri': rule_help_uri
                      })

              if not all_results:
                  print("## ✅ Security Scan Complete")
                  print("")
                  print("No security issues detected by CodeQL.")
              else:
                  critical = [r for r in all_results if r['severity'] == 'Critical']
                  high = [r for r in all_results if r['severity'] == 'High']
                  medium = [r for r in all_results if r['severity'] == 'Medium']
                  low = [r for r in all_results if r['severity'] == 'Low']

                  repo = os.environ.get('GITHUB_REPOSITORY', '')
                  sha = os.environ.get('GITHUB_SHA', '')

                  priority_issues = critical + high
                  if priority_issues:
                      print("## ⚠️ Security Issues Found - BUILD BLOCKED")
                  else:
                      print("## ⚠️ Security Issues Found")

                  print("")
                  print(f"CodeQL detected **{len(all_results)} potential security issue(s)**:")
                  print("")
                  if critical:
                      print(f"- 🔴 **{len(critical)} Critical**")
                  if high:
                      print(f"- 🟠 **{len(high)} High**")
                  if medium:
                      print(f"- 🟡 **{len(medium)} Medium**")
                  if low:
                      print(f"- 🟢 **{len(low)} Low**")
                  print("")

                  print("<details><summary>View all issue(s)</summary>")
                  print("")

                  for i, issue in enumerate(all_results, 1):
                      emoji = {'Critical': '🔴', 'High': '🟠', 'Medium': '🟡', 'Low': '🟢'}.get(issue['severity'], '⚪')
                      print(f"**{i}. {emoji} {issue['severity']}: {issue['rule_name']}**")
                      print(f"- **File**: `{issue['file']}` (line {issue['line']})")
                      if repo and sha and issue['file'] != 'Unknown':
                          file_url = f"https://github.com/{repo}/blob/{sha}/{issue['file']}#L{issue['line']}"
                          print(f"- **View code**: [{issue['file']}:{issue['line']}]({file_url})")
                      print(f"- **Issue**: {issue['message'][:200]}{'...' if len(issue['message']) > 200 else ''}")
                      if issue['fix']:
                          fix_text = issue['fix'].split('.')[0] if '.' in issue['fix'] else issue['fix'][:200]
                          print(f"- **Recommended fix**: {fix_text}")
                      elif issue['help_uri']:
                          print(f"- **Learn more**: [View documentation]({issue['help_uri']})")
                      print("")

                  print("</details>")
                  print("")

                  if priority_issues:
                      print("**⛔ Build blocked**: Critical or High severity issues must be fixed before merging.")
                  else:
                      print("**Note**: Medium and Low severity issues won't block your build, but please review and fix them.")

              # Only fail on Critical/High
              critical = [r for r in all_results if r['severity'] == 'Critical']
              high = [r for r in all_results if r['severity'] == 'High']
              if critical or high:
                  sys.exit(1)

          except Exception as e:
              print("## ⚠️ Security Scan Complete")
              print("")
              print(f"Could not parse SARIF results: {e}")
              print("")
              print("**View details**: Go to the Security tab → Code scanning alerts")

          EOF

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          # Full history so nx-set-shas can find the last successful CI run on
          # the PR's base branch and nx affected can diff against it.
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Restore nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          # Job-specific key so the test and build jobs don't collide on save
          # (shared key → second job's save is a no-op → lost cache next run).
          key: nx-${{ runner.os }}-test-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-test-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-test-

      - name: Derive affected base/head
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
        with:
          # On pull_request this is the target branch; on push to `main`
          # base_ref is empty, so fall back to ref_name (= main).
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Run affected tests
        id: test
        run: |
          pnpm exec nx affected -t test --nxBail=false 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report test results
        if: steps.test.outcome == 'failure'
        run: |
          # nx and vitest colour their output, so strip ANSI first or none of
          # the patterns below match.
          sed 's/\x1b\[[0-9;]*m//g' test-output.txt > test-output-plain.txt

          # Vitest prints the failing suites (❯) and tests (×) as it reaches
          # them, but the API suite's error-path tests then log thousands of
          # Nest ERROR lines from their own fixtures. On a real run (#2598) that
          # pushed the failure list 179 lines from the end, so `tail -100`
          # showed 29 lines of unrelated logging and not one failing test —
          # a red check with no way to tell what broke. Pull the failures out by
          # pattern rather than hoping they land in the tail.
          # Matched as a standalone token rather than anchored to the start of
          # the line: the same output gains a timestamp prefix when read back
          # through the downloaded job log, and an anchored pattern silently
          # finds nothing there.
          grep -E '(^|[[:space:]])(❯|×)[[:space:]]' test-output-plain.txt > failures.txt || true

          # Annotate each failing test so it appears on the PR itself, not only
          # inside a collapsed panel someone has to know to open. GitHub renders
          # up to 10 per step; the rest are in the summary below.
          while IFS= read -r line; do
            echo "::error title=Failing test::${line}"
          done < <(grep -E '(^|[[:space:]])×[[:space:]]' failures.txt | sed 's/^[[:space:]]*//' | head -10)

          {
            echo "## ❌ Tests Failed"
            echo ""
            if [ -s failures.txt ]; then
              echo "### What failed"
              echo ""
              echo '```'
              cat failures.txt
              echo '```'
            else
              echo "No per-test failure lines were found, so the run failed before"
              echo "or outside the test reporter (a build, install or nx error)."
              echo "See the full output below."
            fi
            echo ""
            echo "<details><summary>Full output (last 400 lines)</summary>"
            echo ""
            echo '```'
            tail -400 test-output-plain.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "**Fix it locally:**"
            echo '```bash'
            echo "pnpm exec nx affected -t test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    # Decoupled from typecheck/test/security: runs in parallel as its own
    # required check. CodeQL no longer gates here — it runs nightly (codeql.yml).
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Restore nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          # Job-specific key so the test and build jobs don't collide on save
          # (shared key → second job's save is a no-op → lost cache next run).
          key: nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-build-

      - name: Derive affected base/head
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
        with:
          # On pull_request this is the target branch; on push to `main`
          # base_ref is empty, so fall back to ref_name (= main).
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Build affected packages
        id: build
        run: |
          pnpm exec nx affected -t build --nxBail=false 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report build results
        if: steps.build.outcome == 'failure'
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>View build errors</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -100 build-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix it locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm exec nx affected -t build" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1

  validate-recipes:
    name: Validate Recipes
    # Skip recipe validation on staging-bound PRs: recipes don't change in
    # promotion-only flow. Sandbox/dev PRs (where recipes are actually edited)
    # remain gated.
    if: github.base_ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Validate recipe files
        run: pnpm validate-recipes

  generated-drift:
    name: Generated Files Up To Date
    # Two artifacts are pre-baked from landing content so their consumers carry
    # no runtime dependency on @govtech-bb/content:
    #   - apps/api/src/content/services-index.generated.ts  (`GET /services`)
    #   - packages/content/src/form-categories.generated.ts  (form -> category)
    # Nothing in the build forces a regen, so a content PR that skips it leaves
    # them stale (#2070). Regenerate both here; if they drifted, commit the
    # regen back onto the PR branch rather than only failing (#2303) — the
    # form_builder Content flow writes pages through the GitHub contents API
    # with no checkout and no pnpm, so it can never run the generators itself
    # and every page it adds would otherwise land red.
    # Skipped on staging-bound PRs (promotion-only, content doesn't change),
    # matching validate-recipes.
    if: github.base_ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      # On `pull_request` the default ref is the merge commit, which cannot be
      # pushed back to the branch. Check out the PR head SHA instead (works for
      # forks too, via refs/pull/N/head) and push from the resulting detached
      # HEAD. Trade-off: drift that only appears once base and head are merged
      # is no longer caught here — the post-merge `push: [main]` run of this job
      # is what catches that.
      # persist-credentials stays false (zizmor artipacked); the write-back
      # pushes with an explicitly-minted App token instead.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Regenerate generated files
        run: |
          pnpm generate:services-index
          pnpm generate:form-categories

      - name: Detect drift
        id: drift
        env:
          FILES: apps/api/src/content/services-index.generated.ts packages/content/src/form-categories.generated.ts
        run: |
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- $FILES; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "Generated files are in sync."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- $FILES
          fi

      # Minted only when there is drift to push. An App installation token is
      # required rather than the built-in GITHUB_TOKEN: pushes made with
      # GITHUB_TOKEN do not trigger workflow runs, so the bot commit would
      # arrive with no checks reported and — once "Generated Files Up To Date"
      # joins the Main CI Required ruleset (#2373) — the PR would be blocked
      # forever waiting on checks that can never run.
      - name: Mint GitHub App token
        id: app-token
        if: |
          steps.drift.outputs.drifted == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2 # zizmor: ignore[github-app]
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOARD_BOT_APP_ID }}
          private-key: ${{ secrets.BOARD_BOT_PRIVATE_KEY }}

      - name: Commit the regen back to the PR branch
        id: writeback
        if: steps.app-token.outcome == 'success' && steps.app-token.outputs.token != ''
        continue-on-error: true
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          FILES: ${{ steps.drift.outputs.files }}
        run: |
          git add -- $FILES
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: regenerate content-derived generated files" \
                     -m "Automated by the Generated Files Up To Date job. Regenerate locally with \`pnpm generate:services-index && pnpm generate:form-categories\`."
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "HEAD:refs/heads/${BRANCH}"

      - name: Report outcome
        env:
          DRIFTED: ${{ steps.drift.outputs.drifted }}
          PUSHED: ${{ steps.writeback.outcome }}
        run: |
          if [ "$DRIFTED" != "true" ]; then
            exit 0
          fi

          if [ "$PUSHED" = "success" ]; then
            {
              echo "## ✅ Generated files were out of date and have been regenerated"
              echo ""
              echo "A commit regenerating them was pushed to this PR branch. A fresh CI run is validating it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ❌ Generated files are out of date"
            echo ""
            echo "Landing content changed but the content-derived generated files were not regenerated, so \`GET /services\` and the form→category map would serve stale data."
            echo ""
            echo "The automatic write-back did not run or could not push (fork PR, missing App credentials, or the App lacks \`contents: write\` on this repo — see #2303)."
            echo ""
            echo "**Fix locally:**"
            echo '```bash'
            echo "pnpm generate:services-index"
            echo "pnpm generate:form-categories"
            echo '```'
            echo "then commit the updated files."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Restore nx cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          # Job-specific key so lint/test/build don't collide on cache save.
          key: nx-${{ runner.os }}-lint-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-lint-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-lint-

      - name: Derive affected base/head
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
        with:
          # On pull_request this is the target branch; on push to `main`
          # base_ref is empty, so fall back to ref_name (= main).
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Lint affected projects
        id: lint
        run: |
          # The trunk lint gate now runs over every affected app — no exclusions.
          # The ratchet introduced during the prod→main resync (#1884) is fully
          # burned down: analytics-app, landing, forms, api, form-builder-app
          # all cleaned and enforced (#1885, PRs #1891/#1892/#1893/#1919/#1912).
          pnpm exec nx affected -t lint --nxBail=false 2>&1 | tee lint-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Report lint results
        if: steps.lint.outcome == 'failure'
        run: |
          echo "## ❌ Lint Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>View lint errors</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -100 lint-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix it locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pnpm exec nx affected -t lint" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1

  docker-build:
    # Build every Dockerfile in the repo on every PR. Catches refactors that
    # orphan a `COPY` path (the class of bug that broke sandbox CD after
    # commit a8d25528 deleted apps/form_builder/app/server/ai-builder/prompts
    # while the form_builder_api Dockerfile still referenced it).
    #
    # `push: false` — no ECR push, just validate the build context. Faster
    # than full deploy since we don't run the image, just compile it.
    # GHA layer cache scoped per Dockerfile so a change to one doesn't bust
    # the others.
    name: Docker Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: api
            dockerfile: apps/api/Dockerfile
          - label: form-builder-api
            dockerfile: apps/form_builder_api/Dockerfile
          - label: chat-ingest
            dockerfile: apps/chat/Dockerfile.ingest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.label }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.label }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.label }}
