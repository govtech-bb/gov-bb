name: Compare staging api_v2 with estate.json

# Runs check-import against staging api_v2: every snapshot page's status, and
# the content of each page the preview token can read, against the estate.json
# on the staging branch, the commit staging runs (#3710). The database is
# loaded once, so a newer snapshot leaves it behind, and this run goes red.
# Fix the drift with sync-estate (api_v2 README, "Drift before cutover").
#
# A workflow of its own, so drift never turns Deploy Staging red. It runs
# after each Deploy Staging run and nightly. Both triggers fire only for this
# file on main. Run it by hand from main to re-check.
#
# Sandbox switched to api_v2 at #3311, so it is no longer checked (#3709).
# #3227 deletes this workflow at staging's cutover: from then on the database
# is the source of truth and differences are editors' work.

on:
  # Deploy Staging runs only by dispatch, and this job checks out the staging
  # branch, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Staging]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estate-drift:
    name: Compare staging with estate.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: staging
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check every snapshot page
        env:
          # Equals staging api_v2's PREVIEW_SECRET (see deploy-staging.yml).
          PREVIEW_SECRET: ${{ secrets.RECIPE_PREVIEW_TOKEN_STAGING }}
          API_URL: https://api.staging.alpha.gov.bb/v2
          FORMS_API: https://api.staging.alpha.gov.bb
        run: pnpm --filter @govtech-bb/api-v2 check-import --base-url "$API_URL" --forms-api "$FORMS_API"
