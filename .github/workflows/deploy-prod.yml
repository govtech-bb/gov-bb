name: Deploy Production

# Reliability-first production CD. Port of deploy-staging.yml, retargeted at the
# prod account (996501092968, ca-central-1). Same design as staging:
#
# Design:
#   - All deploy targets run as parallel independent jobs. Each owns its own
#     end-to-end verification (build → push → roll → smoke test). One failing
#     job does NOT cancel others — we want full visibility on every layer.
#   - ECS deploys verify the *deployed* task def matches the *registered* one
#     (catches silent rollback) and check ALB target health post-deploy.
#   - Amplify auto-build is OFF on the prod branch; this workflow is the sole
#     trigger. Each Amplify job runs start-job → monitor → URL smoke test.
#   - Roll-forward only: when a container fails to start, the workflow fails
#     loudly. No silent revert. Fix-forward via a new commit, never via
#     rollback magic.
#
# Prod deltas vs staging:
#   - form-builder is NOT wired up in production (decision 2026-06-04): no
#     deploy-form-builder (API) or amplify-form-builder job, no fb-* targets.
#   - Public DNS is not cut over yet (Phase 1). Smoke tests hit the ALB DNS
#     (HTTP) and the *.amplifyapp.com default domains instead of the friendly
#     *.alpha.gov.bb hostnames — same as staging's own pre-DNS phase. Switch to
#     api.ssb/forms/chat/landing .alpha.gov.bb once DNS + the :443 listener land.
#   - workflow_dispatch exposes a `deploy_all` input to force every target,
#     ignoring affected detection — needed to bootstrap the first prod deploy
#     (ECR image + forms-db migrations) since a workflow-only push marks nothing
#     affected.
#
# Prereqs:
#   - Repo secret AWS_ROLE_ARN_PROD set to the gov-bb-github-actions-prod role
#     ARN (output by alpha-infra's prod stack — gov-bb-github-oidc.tf).
#   - The prod Amplify apps connected to govtech-bb/gov-bb branch `prod` in the
#     Amplify console, auto-build OFF.

on:
  # TRUNK: production is NEVER automatic. This is the manual, windowed
  # "Deploy Production" button — run it from the `staging` branch (Actions →
  # Deploy Production → Run workflow → Branch: staging) so prod ships exactly
  # the commit staging proved. The `advance-prod` job fast-forwards the `prod`
  # branch to that commit and a guard blocks running from any branch but
  # `staging` (unless explicitly overridden for a rollback/hotfix).
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Force-deploy all targets (bootstrap / full redeploy), ignoring affected detection"
        type: boolean
        default: false
      allow_non_staging:
        description: "Override the staging-only guard (rollback/hotfix from another ref). Leave off for normal releases."
        type: boolean
        default: false

permissions:
  # Single-purpose deploy workflow: every job assumes the AWS deploy role via
  # OIDC, so a workflow-level id-token grant is intentional. Per-job scoping
  # tracked in #1462.
  id-token: write # zizmor: ignore[excessive-permissions]
  # Branch-advance write is granted at the JOB level (advance-prod) so the
  # deploy jobs stay read-only.
  contents: read

# Queue deploys; never cancel one mid-flight. A half-applied deploy must
# finish before the next starts.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: ssb-api
  ECS_CLUSTER: simple-service-builder-prod
  ECS_SERVICE: ssb-api-prod

  # Smoke test URLs. The API's friendly DNS + :443 listener have landed, and the
  # ALB now force-redirects HTTP→HTTPS (301) — so hitting the raw ALB over HTTP
  # fails the smoke (301 ≠ 200, and the ALB DNS doesn't match the cert, so
  # following the redirect breaks too). Smoke the friendly HTTPS host, which
  # returns 200 through to the app. The Amplify apps still use their default
  # *.amplifyapp.com domains over TLS until their friendly DNS is cut over.
  API_SMOKE_URL: https://api.ssb.alpha.gov.bb/health
  AMPLIFY_FORMS_URL: https://prod.d2a6u3uw8mle6w.amplifyapp.com
  AMPLIFY_LANDING_URL: https://prod.d33h8dmrfcznn0.amplifyapp.com

jobs:
  # Guard + move the `prod` pointer to the commit being deployed BEFORE any
  # Amplify job runs (Amplify builds the `prod` branch). The guard blocks any
  # ref but `staging`, so production only ever ships staging-proven code —
  # override only for a deliberate rollback/hotfix.
  advance-prod:
    name: Guard + advance prod branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # fast-forward the prod branch ref
    outputs:
      # The SHA prod was serving BEFORE this deploy. `setup` uses it as the
      # affected base — see the rationale on its "Derive base/head SHAs" step.
      previous-sha: ${{ steps.previous.outputs.sha }}
    steps:
      - name: Guard — prod ships staging-proven code only
        env:
          # Via env, not inline ${{ }}, so ref/input values can't expand into
          # the shell (zizmor template-injection).
          REF_NAME: ${{ github.ref_name }}
          ALLOW_NON_STAGING: ${{ inputs.allow_non_staging }}
        run: |
          if [ "$REF_NAME" != "staging" ] && [ "$ALLOW_NON_STAGING" != "true" ]; then
            echo "❌ Deploy Production must be run from the 'staging' branch (the proven code)."
            echo "   Re-run: Actions → Deploy Production → Run workflow → Branch: staging."
            echo "   For a deliberate rollback/hotfix from another ref, set allow_non_staging=true."
            exit 1
          fi
      - name: Fast-forward prod → ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/prod" \
            -f sha="${{ github.sha }}" -F force=false

  setup:
    name: Detect affected targets
    needs: advance-prod
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.affected.outputs.api }}
      forms: ${{ steps.affected.outputs.forms }}
      landing: ${{ steps.affected.outputs.landing }}
      ff-app: ${{ steps.affected.outputs.ff-app }}
      analytics: ${{ steps.affected.outputs.analytics }}
      migrations: ${{ steps.affected.outputs.migrations }}
      amplify-config: ${{ steps.affected.outputs.amplify-config }}
      # Surfaced so the deployment summary records the exact window deployed —
      # a green run that rebuilt nothing should be visible, not inferred.
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # The affected base is the SHA prod was ACTUALLY serving before this run,
      # captured by advance-prod before it moved the ref.
      #
      # This replaced nx-set-shas (main-branch-name: staging, workflow-id:
      # deploy-prod.yml). That action resolves the base from the last successful
      # run on a branch, and when the lookup misses it falls back to HEAD~1 with
      # only a WARNING — so the deploy stays green while shipping one commit's
      # worth of targets. Run 30490271277 (2026-07-29, dd3297ef) hit exactly
      # that: a 96-commit promotion logged `Affected apps: ["landing"]` and
      # deployed landing alone, skipping api (89 changed files), forms (29) and
      # analytics (18). The analytics Amplify app then had to be rebuilt from
      # the console by hand, and prod's api had no successful deploy from
      # 2026-07-20 onward while the prod ref claimed otherwise.
      #
      # Deriving from the ref cannot degrade that way: it asks the question that
      # actually matters ("what changed since prod last shipped"), needs no
      # bootstrap run, and fails loudly below rather than under-deploying.
      # sandbox/staging keep nx-set-shas — they run on `main`, which matches
      # their main-branch-name, so their lookup chains correctly.
      - name: Derive base/head SHAs
        id: shas
        env:
          PROD_BEFORE: ${{ needs.advance-prod.outputs.previous-sha }}
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all }}
        run: |
          echo "NX_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "deploy_all=true — affected detection bypassed; every target deploys."
            echo "NX_BASE=${PROD_BEFORE:-$GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "base=${PROD_BEFORE:-(bypassed)}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fail() {
            echo "$1"
            echo "   Re-run with deploy_all=true to deploy every target."
            exit 1
          }

          [ -n "$PROD_BEFORE" ] ||
            fail "❌ Could not read the prod ref, so the affected base is unknown."

          git cat-file -e "${PROD_BEFORE}^{commit}" 2>/dev/null ||
            fail "❌ prod's current SHA ($PROD_BEFORE) is not present in this checkout."

          # A non-ancestor base means a rollback or an out-of-line ref. Diffing
          # against it would mark only the divergent paths, leaving prod running
          # a mix of old and new — so require the explicit full deploy instead.
          git merge-base --is-ancestor "$PROD_BEFORE" "$GITHUB_SHA" ||
            fail "❌ prod's SHA ($PROD_BEFORE) is not an ancestor of $GITHUB_SHA (rollback or out-of-line ref); a partial deploy would leave prod mixing commits."

          echo "NX_BASE=$PROD_BEFORE" >> "$GITHUB_ENV"
          echo "base=$PROD_BEFORE" >> "$GITHUB_OUTPUT"

          if [ "$PROD_BEFORE" = "$GITHUB_SHA" ]; then
            echo "prod is already at $GITHUB_SHA — no new commits to deploy."
          else
            echo "Affected window: $PROD_BEFORE..$GITHUB_SHA ($(git rev-list --count "${PROD_BEFORE}..${GITHUB_SHA}") commits)"
          fi

      - name: Compute affected deploy targets
        id: affected
        env:
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all }}
        run: |
          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "Manual deploy_all=true — forcing every target (affected detection bypassed)"
          fi

          AFFECTED=$(pnpm exec nx show projects \
            --affected --base="$NX_BASE" --head="$NX_HEAD" --type app --json 2>/dev/null || echo '[]')
          echo "Affected apps: $AFFECTED"
          has() {
            if [ "$DEPLOY_ALL" = "true" ]; then echo true; return; fi
            echo "$AFFECTED" | jq -e --arg p "$1" 'index($p)' >/dev/null && echo true || echo false
          }

          echo "api=$(has api)" >> "$GITHUB_OUTPUT"
          echo "forms=$(has forms)" >> "$GITHUB_OUTPUT"
          echo "landing=$(has landing)" >> "$GITHUB_OUTPUT"
          echo "ff-app=$(has feature-flagging-app)" >> "$GITHUB_OUTPUT"
          echo "analytics=$(has analytics-app)" >> "$GITHUB_OUTPUT"

          # TypeORM migrations live in packages/database/src/migrations/ (22 of
          # them). The previous pattern matched only apps/api/src/database/
          # migrations/, which holds nothing but .gitkeep, a README and smoke
          # specs — so this gate never fired for a real migration and
          # `pnpm migration:run` executed only when deploy_all forced it.
          #
          # That is worse than a missed deploy: `api` still deploys whenever it
          # is affected, so new code ships against an unmigrated schema.
          # 1784000000000-AddMinistryKeyToMdaContact (2026-07-28) adds
          # mda_contact.ministry_key, which MdaContact declares and the
          # form-config + webhook-destination services read — without the column
          # those queries error in prod.
          #
          # Both paths match: the apps/api tree's migration smoke specs are
          # legitimately migration-adjacent, so a change there should still run
          # them. Chat's drizzle migrations are deliberately absent — the ingest
          # image applies those itself via its entrypoint.
          if [ "$DEPLOY_ALL" = "true" ] || git diff --name-only "$NX_BASE" "$NX_HEAD" \
              | grep -qE '^(packages/database/src|apps/api/src/database)/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DEPLOY_ALL" = "true" ] || git diff --name-only "$NX_BASE" "$NX_HEAD" \
              | grep -qE '^(amplify\.yml|\.github/workflows/deploy-prod\.yml)$'; then
            echo "amplify-config=true" >> "$GITHUB_OUTPUT"
          else
            echo "amplify-config=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # ECS deploys — each verifies the rollout landed on the registered task def
  # and the ALB targets are healthy, then hits the service's health endpoint.
  # ---------------------------------------------------------------------------

  deploy-api:
    name: Build, Push & Deploy API
    needs: setup
    if: needs.setup.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          LATEST_URI="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:latest"
          docker build --platform linux/amd64 -f apps/api/Dockerfile -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ssb-api-prod \
            --region $AWS_REGION \
            --query taskDefinition \
            --output json > task-def.json

      - name: Render task definition with new image
        id: new-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.build.outputs.image }}

      - name: Run database migrations
        if: needs.setup.outputs.migrations == 'true'
        run: |
          set -euo pipefail
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$(cat ${{ steps.new-task-def.outputs.task-definition }} | \
              jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')" \
            --region $AWS_REGION \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "Migration task def: $TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-07a490c8b7bbc6622,subnet-0c052b93d42a9711f],securityGroups=[sg-0a5ee82a653cd6000],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["pnpm","migration:run"]}]}' \
            --region $AWS_REGION \
            --query tasks[0].taskArn \
            --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks "$TASK_ARN" --region $AWS_REGION

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER --tasks "$TASK_ARN" --region $AWS_REGION \
            --query "tasks[0].containers[?name=='api'].exitCode | [0]" --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed (exit $EXIT_CODE). Logs: aws logs tail /ecs/ssb-api-prod --follow"
            exit 1
          fi
          echo "✅ Migrations succeeded"

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.new-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ECS deployment landed (catches silent rollback)
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: bash .github/scripts/verify-ecs-deployment.sh

      - name: Smoke test API /health
        env:
          URL: ${{ env.API_SMOKE_URL }}
          LABEL: api
        run: bash .github/scripts/smoke-test-url.sh

  # ---------------------------------------------------------------------------
  # SSR smoke gate — boots each affected WEB_COMPUTE app's BUILT compute server
  # in the runner and asserts its homepage responds (<500, no hang) BEFORE the
  # Amplify deploy jobs run. Catches "compiles clean but hangs/5xx at runtime"
  # regressions that build/typecheck/unit all miss. amplify-landing needs
  # this job, so a failure here BLOCKS the deploy and prod stays on the last good
  # version. forms is static (WEB) — no compute server to smoke.
  # ---------------------------------------------------------------------------
  ssr-smoke:
    name: SSR smoke (web-compute apps)
    needs: setup
    if: |
      needs.setup.outputs.landing == 'true'
      || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Smoke landing
        if: needs.setup.outputs.landing == 'true' || needs.setup.outputs.amplify-config == 'true'
        env:
          # landing's prebuild fetches the live form manifest; point it at the
          # prod API (ALB DNS over HTTP until api.ssb DNS + :443 land) so the
          # build resolves against the env it deploys into.
          VITE_FORMS_API_URL: http://ssb-api-prod-1165104707.ca-central-1.elb.amazonaws.com
        run: |
          pnpm exec nx build landing
          node .github/scripts/ssr-smoke.mjs apps/landing/.amplify-hosting/compute/default landing

  # ---------------------------------------------------------------------------
  # Amplify deploys — auto-build is OFF on the prod branch, so this workflow is
  # the sole trigger. Each job runs start-job → monitor → URL smoke test.
  #
  # The WEB_COMPUTE apps also `needs: ssr-smoke` — a runtime hang there blocks
  # the deploy entirely, so a broken SSR build never reaches the live URL.
  # ---------------------------------------------------------------------------

  amplify-forms:
    name: Amplify build (forms)
    needs: setup
    if: needs.setup.outputs.forms == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          AMPLIFY_APP_ID: d2a6u3uw8mle6w
          AMPLIFY_BRANCH: prod
          APP_LABEL: forms
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test forms URL
        env:
          URL: ${{ env.AMPLIFY_FORMS_URL }}
          LABEL: forms
        run: bash .github/scripts/smoke-test-url.sh

  amplify-feature-flagging:
    name: Amplify build (feature-flagging)
    needs: setup
    if: needs.setup.outputs.ff-app == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          # Feature-flagging admin UI (apps/feature_flagging SSR) at
          # feature-flagging.alpha.gov.bb (gov-bb #1924).
          AMPLIFY_APP_ID: dl9ivbwj4a6go
          AMPLIFY_BRANCH: prod
          APP_LABEL: feature-flagging
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test feature-flagging URL
        env:
          URL: https://feature-flagging.alpha.gov.bb
          LABEL: feature-flagging
          # Auth-gated SSR: unauthenticated requests 307 to the GitHub OAuth flow.
          EXPECT_CODES: "200,302,307"
        run: bash .github/scripts/smoke-test-url.sh

  amplify-landing:
    name: Amplify build (landing)
    needs: [setup, ssr-smoke]
    if: needs.setup.outputs.landing == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          AMPLIFY_APP_ID: d33h8dmrfcznn0
          AMPLIFY_BRANCH: prod
          APP_LABEL: landing
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test landing URL
        env:
          URL: ${{ env.AMPLIFY_LANDING_URL }}
          LABEL: landing
        run: bash .github/scripts/smoke-test-url.sh

  amplify-analytics:
    name: Amplify build (analytics)
    needs: setup
    if: needs.setup.outputs.analytics == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          # Analytics dashboard (apps/analytics SSR) at analytics.alpha.gov.bb.
          # Unlike sandbox, prod injects NO Umami env here: non-secret config is
          # IaC-managed on the app, and the API key is read from Secrets Manager
          # at runtime via the compute role (alpha-infra #465, gov-bb #2046).
          AMPLIFY_APP_ID: d3qiieyhd6mk7u
          AMPLIFY_BRANCH: prod
          APP_LABEL: analytics
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test analytics URL
        env:
          URL: https://analytics.alpha.gov.bb
          LABEL: analytics
          # Public SSR: unparametrised requests 307 to the default range view.
          EXPECT_CODES: "200,302,307"
        run: bash .github/scripts/smoke-test-url.sh

  summary:
    name: Deployment summary
    needs: [setup, deploy-api, ssr-smoke, amplify-forms, amplify-landing, amplify-feature-flagging, amplify-analytics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          row() {
            local label="$1" result="$2"
            case "$result" in
              success) echo "| $label | ✅ deployed |" ;;
              failure) echo "| $label | ❌ FAILED |" ;;
              skipped) echo "| $label | ⏭ skipped (unaffected) |" ;;
              cancelled) echo "| $label | ⚠ cancelled |" ;;
              *) echo "| $label | $result |" ;;
            esac
          }

          {
            echo "## Production Deployment Summary"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Deployed window:** \`${{ needs.setup.outputs.base }}..${{ needs.setup.outputs.head }}\`"
            echo ""
            echo "| Target | Result |"
            echo "|--------|--------|"
            row "SSR smoke (pre-deploy)" "${{ needs.ssr-smoke.result }}"
            row "API"                  "${{ needs.deploy-api.result }}"
            row "Amplify forms"        "${{ needs.amplify-forms.result }}"
            row "Amplify landing"      "${{ needs.amplify-landing.result }}"
            row "Amplify feature-flagging" "${{ needs.amplify-feature-flagging.result }}"
            # analytics was already in this job's `needs` but had no row, so the
            # 2026-07-29 deploy reported success without ever showing that
            # analytics had been skipped. Unreported targets hide drift.
            row "Amplify analytics"   "${{ needs.amplify-analytics.result }}"
            echo ""
            echo "**URLs (ALB / amplifyapp.com until DNS lands):**"
            echo "- API: ${{ env.API_SMOKE_URL }}"
            echo "- forms: ${{ env.AMPLIFY_FORMS_URL }}"
            echo "- landing: ${{ env.AMPLIFY_LANDING_URL }}"
            echo "- feature-flagging: https://feature-flagging.alpha.gov.bb"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Durable release record. Tags the deployed commit and cuts a GitHub Release
  # whose body GitHub auto-generates from the PRs merged since the PREVIOUS
  # release tag — so the Releases tab (github.com/<repo>/releases) is a
  # permanent, browsable log of what each prod deploy shipped. The same PR list
  # is echoed into the run summary.
  #
  # Runs on every deploy regardless of individual target outcome (the commit
  # became prod the moment advance-prod fast-forwarded the pointer), but ONLY
  # if advance-prod succeeded — if the guard blocked or the fast-forward failed,
  # nothing became prod, so there is nothing to tag. Downstream of the deploy
  # jobs, so it never gates the rollout; it fails loudly (not silently) if the
  # release can't be cut.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Tag + release notes
    needs:
      - advance-prod
      - deploy-api
      - amplify-forms
      - amplify-landing
      - amplify-feature-flagging
    if: always() && needs.advance-prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Job-scoped write to create the tag + release; the deploy jobs stay
      # read-only (same pattern as advance-prod).
      contents: write
    steps:
      - name: Create tag + GitHub Release with generated notes
        env:
          # Via env, not inline ${{ }}, so context values can't expand into the
          # shell (zizmor template-injection), matching advance-prod's style.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="prod-$(date -u +%Y-%m-%d)-${SHA:0:7}"
          echo "Cutting release $TAG at $SHA"

          # GitHub caps a release body at 125,000 chars. `--generate-notes`
          # covers every PR since the PREVIOUS release tag — but on the
          # first-ever release there is no previous tag, so the notes span the
          # ENTIRE history and blow past the cap (HTTP 422 "body is too long").
          # That also deadlocks: the failed create leaves no baseline tag, so the
          # range never shrinks. Fix: generate notes via the API bounded to the
          # previous tag, cap the body under the limit, and create from a file.
          # When there is no previous release yet, cut a short baseline release to
          # establish the tag; subsequent deploys then get proper bounded notes.
          MAX=120000

          PREV=$(gh release list --repo "$REPO" --limit 1 --json tagName -q '.[0].tagName // ""' 2>/dev/null || true)

          if [ -n "$PREV" ]; then
            echo "Previous release: $PREV — generating notes since then"
            gh api "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f previous_tag_name="$PREV" \
              --jq .body > notes.md \
              || echo "_Automatic release-notes generation failed; see the run log._" > notes.md
          else
            echo "No previous release found — cutting a baseline release (no full-history notes)"
            printf '%s\n' "Baseline production release. Prior commit history is not enumerated in this release body; future releases list PRs merged since the previous release." > notes.md
          fi

          # Stay safely under GitHub's 125,000-char release-body limit.
          if [ "$(wc -c < notes.md)" -gt "$MAX" ]; then
            echo "notes body $(wc -c < notes.md) bytes > $MAX — truncating"
            head -c "$MAX" notes.md > notes.trunc.md
            printf '\n\n_...release notes truncated to fit the 125,000-character release-body limit._\n' >> notes.trunc.md
            mv notes.trunc.md notes.md
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Production release $TAG" \
            --notes-file notes.md \
            --latest

          {
            echo "## Production Release Notes"
            echo ""
            echo "**Tag:** \`$TAG\` — https://github.com/$REPO/releases/tag/$TAG"
            echo ""
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
