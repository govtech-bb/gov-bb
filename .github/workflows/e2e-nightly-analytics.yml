name: E2E Nightly Analytics

# Journey 7 (#3014): walk the `e2e-analytics-check` test form on sandbox,
# assert the Umami events it sends, then wait for the analytics dashboard to
# show them. Nightly and off the deploy path — Umami data can arrive late, so
# this never blocks a deploy. A failure alerts Slack.
#
# No X-Smoke-Submission header: the test form has no processors, and the header
# would ride along to Umami's /api/send as a custom (preflighted) header.

on:
  schedule:
    # 09:00 UTC = 05:00 in Barbados, well clear of the dashboard's "today"
    # boundary at Barbados midnight.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly-analytics
  cancel-in-progress: false

jobs:
  journey-7:
    name: Journey 7 (forms analytics → Umami → dashboard)
    # The nightly run stays off until the sandbox Umami setup is done (#3360):
    # set the repo variable E2E_ANALYTICS_ENABLED=true to turn it on. Until
    # then it would fail closed every night and train people to ignore the
    # alert. A manual run always goes ahead.
    if: github.event_name == 'workflow_dispatch' || vars.E2E_ANALYTICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The spec waits up to 15 min for Umami + the dashboard cache.
    timeout-minutes: 30
    steps:
      - name: Require the preview token
        env:
          PREVIEW_TOKEN: ${{ secrets.E2E_RECIPE_PREVIEW_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TOKEN" ]; then
            echo "::error::E2E_RECIPE_PREVIEW_TOKEN is not set — it must match sandbox's RECIPE_PREVIEW_TOKEN so the run can open the preview test form."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @govtech-bb/forms exec playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "could not resolve playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/forms exec playwright install chromium
      - name: Run journey 7
        env:
          SMOKE_BASE_URL: https://forms.sandbox.alpha.gov.bb
          E2E_ANALYTICS_URL: https://analytics.sandbox.alpha.gov.bb
          PREVIEW_TOKEN: ${{ secrets.E2E_RECIPE_PREVIEW_TOKEN }}
        run: >
          pnpm --filter @govtech-bb/forms exec playwright test
          --config playwright.smoke.config.ts
          journey-7-analytics.smoke.spec.ts
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-7-analytics-trace
          path: apps/forms/test-results/
          retention-days: 7

  notify-failure:
    name: Notify Slack on failure
    needs: [journey-7]
    if: always() && needs.journey-7.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *Nightly E2E J7 failed* — forms analytics events did not reach Umami / the analytics dashboard on sandbox\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>"
            }
