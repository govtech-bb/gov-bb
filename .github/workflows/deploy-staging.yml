name: Deploy Staging

# Reliability-first staging CD. See docs/plans/staging-cicd-reliability-first.md.
#
# Design:
#   - All deploy targets run as parallel independent jobs. Each owns its own
#     end-to-end verification (build → push → roll → smoke test). One failing
#     job does NOT cancel others — we want full visibility on every layer.
#   - ECS deploys verify the *deployed* task def matches the *registered* one
#     (catches silent rollback) and check ALB target health post-deploy.
#   - Amplify auto-build is OFF on the staging branch; this workflow is the
#     sole trigger. Each Amplify job runs start-job → monitor → URL smoke
#     test.
#   - Roll-forward only: when a container fails to start, the workflow fails
#     loudly. No silent revert. Fix-forward via a new commit, never via
#     rollback magic.
#
# Prereqs:
#   - Repo secret AWS_ROLE_ARN_STAGING set to the gov-bb-github-actions-staging
#     role ARN (output by alpha-infra's staging stack — see PR #240).
#   - The 4 staging Amplify apps connected to govtech-bb/gov-bb branch
#     `staging` in the Amplify console with auto-build set per app IaC.
#   - api_v2 and editor_v2 (#3130): alpha-infra's staging stack (#821) and
#     gov-bb-editor-v2-staging connected to `staging`, root apps/editor_v2.

on:
  # TRUNK: staging is NOT pushed to directly. deploy-sandbox's
  # `promote-to-staging` fast-forwards `staging` to the commit sandbox proved and
  # dispatches this workflow ON `staging`, so the run deploys exactly that commit
  # (#2756). A manual run from main (Actions tab) still works: advance-staging
  # fast-forwards `staging` to main's HEAD first so Amplify, which builds the
  # `staging` branch, matches the ECS deploys.
  workflow_dispatch:

permissions:
  # Single-purpose deploy workflow: every job assumes the AWS deploy role via
  # OIDC, so a workflow-level id-token grant is intentional. Per-job scoping
  # tracked in #1462.
  id-token: write # zizmor: ignore[excessive-permissions]
  # Branch-advance write is granted at the JOB level (advance-staging) so the
  # deploy jobs stay read-only.
  contents: read

# Queue deploys; never cancel one mid-flight. A half-applied deploy must
# finish before the next starts.
# One queue whichever branch the run is on — deploy-sandbox's promote job joins
# it too, so `staging` never moves under an in-flight deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: ssb-api
  ECS_CLUSTER: simple-service-builder-staging
  ECS_SERVICE: ssb-api-staging

  # Smoke test URLs — friendly *.staging.alpha.gov.bb hostnames. DNS + ACM +
  # the ALB HTTPS listener landed in alpha-infra PR-3 (network + staging stack),
  # so smoke tests now hit the real URLs QA uses, over TLS.
  API_SMOKE_URL: https://api.staging.alpha.gov.bb/health
  AMPLIFY_FORMS_URL: https://forms.staging.alpha.gov.bb
  AMPLIFY_LANDING_URL: https://staging.alpha.gov.bb
  AMPLIFY_FEATURE_FLAGGING_URL: https://feature-flagging.staging.alpha.gov.bb
  # api_v2's base URL (#3745): the smoke paths are appended to it.
  API_V2_URL: https://api.staging.alpha.gov.bb/v2
  AMPLIFY_EDITOR_V2_URL: https://editor.staging.alpha.gov.bb

jobs:
  # Move the `staging` deploy pointer to the commit being deployed BEFORE any
  # Amplify job runs (Amplify builds the `staging` branch). A promoted run is
  # already on `staging` (promote-to-staging moved it), so only a manual run
  # from main has anything to do. force=false → fast-forward only.
  advance-staging:
    name: Advance staging branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # fast-forward the staging branch ref
    steps:
      - name: Fast-forward staging → ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            staging)
              # Amplify builds the staging tip while ECS deploys GITHUB_SHA;
              # refuse to start if anything has moved staging since dispatch.
              TIP=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)
              if [ "$TIP" != "$GITHUB_SHA" ]; then
                echo "❌ staging is at $TIP, not $GITHUB_SHA — Amplify and ECS would deploy different commits."
                exit 1
              fi
              echo "Promoted from sandbox: staging is already at ${GITHUB_SHA}"
              exit 0 ;;
            main) ;;
            *)
              # Fast-forwarding staging onto an unmerged branch would ship code
              # that never went through main or sandbox.
              echo "❌ Deploy Staging runs from main (manual) or staging (promoted), not $GITHUB_REF_NAME."
              exit 1 ;;
          esac
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/staging" \
            -f sha="${{ github.sha }}" -F force=false

  setup:
    name: Detect affected targets
    needs: advance-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list this workflow's past runs to find the affected base
    outputs:
      api: ${{ steps.affected.outputs.api }}
      forms: ${{ steps.affected.outputs.forms }}
      landing: ${{ steps.affected.outputs.landing }}
      ff-app: ${{ steps.affected.outputs.ff-app }}
      api-v2: ${{ steps.affected.outputs.api-v2 }}
      editor-v2: ${{ steps.affected.outputs.editor-v2 }}
      migrations: ${{ steps.affected.outputs.migrations }}
      amplify-config: ${{ steps.affected.outputs.amplify-config }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # The affected base is the commit of the last successful deploy-staging
      # run — on `staging` (promoted) or main (manual) — so a skipped or failed
      # promotion is picked up by the next one. head_sha is the commit that run
      # deployed, because a promoted run is dispatched on `staging` (#2756).
      #
      # This replaced nrwl/nx-set-shas. That action only accepts a past run whose
      # commit is among the latest 100 on main (one page of GET /commits). After
      # the 30 Sep deploy (4e07352), staging failed for other reasons until main
      # was 100 commits ahead; from then on every run failed here with "Unable to
      # find a successful workflow run", and could never recover on its own
      # (runs 2026-10-10 onward). An ancestry check against the full checkout has
      # no window. As before, a missing base fails loudly rather than falling
      # back to HEAD~1 and under-deploying (run 35656441931).
      - name: Derive base/head SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "NX_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"

          BASE=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?event=workflow_dispatch&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.head_branch == "staging" or .head_branch == "main")][0].head_sha // empty')

          [ -n "$BASE" ] || {
            echo "❌ No successful deploy-staging run on staging or main, so the affected base is unknown."
            exit 1
          }
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || {
            echo "❌ The last deployed SHA ($BASE) is not in this checkout."
            exit 1
          }
          # A non-ancestor means main was rewritten; diffing against it would
          # deploy only the divergent paths.
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA" || {
            echo "❌ The last deployed SHA ($BASE) is not an ancestor of $GITHUB_SHA."
            exit 1
          }

          echo "NX_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Affected window: $BASE..$GITHUB_SHA ($(git rev-list --count "${BASE}..${GITHUB_SHA}") commits)"

      - name: Compute affected deploy targets
        id: affected
        run: |
          AFFECTED=$(pnpm exec nx show projects \
            --affected --base="$NX_BASE" --head="$NX_HEAD" --type app --json)
          echo "Affected apps: $AFFECTED"
          has() { echo "$AFFECTED" | jq -e --arg p "$1" 'index($p)' >/dev/null && echo true || echo false; }

          echo "api=$(has api)" >> "$GITHUB_OUTPUT"
          echo "forms=$(has forms)" >> "$GITHUB_OUTPUT"
          echo "landing=$(has landing)" >> "$GITHUB_OUTPUT"
          echo "ff-app=$(has feature-flagging-app)" >> "$GITHUB_OUTPUT"
          echo "editor-v2=$(has editor_v2)" >> "$GITHUB_OUTPUT"

          # api_v2 also deploys when this workflow changes, as the Amplify
          # apps do through amplify-config below. That is how its first staging
          # deploy happens: until then the ECR repo is empty and the service
          # sits at desired_count 0.
          if [ "$(has api_v2)" = true ] || git diff --name-only "$NX_BASE" "$NX_HEAD" \
              | grep -qx '.github/workflows/deploy-staging.yml'; then
            echo "api-v2=true" >> "$GITHUB_OUTPUT"
          else
            echo "api-v2=false" >> "$GITHUB_OUTPUT"
          fi

          # TypeORM migrations live in packages/database/src/migrations/; the old
          # pattern matched only apps/api/src/database/migrations/, which holds
          # just .gitkeep, a README and smoke specs — so this never fired for a
          # real migration and staging shipped API code against an unmigrated
          # schema. Both paths match; chat's drizzle migrations are excluded
          # because the ingest image applies those itself. See deploy-prod.yml.
          if git diff --name-only "$NX_BASE" "$NX_HEAD" \
              | grep -qE '^(packages/database/src|apps/api/src/database)/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$NX_BASE" "$NX_HEAD" \
              | grep -qE '^(amplify\.yml|\.github/workflows/deploy-staging\.yml)$'; then
            echo "amplify-config=true" >> "$GITHUB_OUTPUT"
          else
            echo "amplify-config=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # ECS deploys — each verifies the rollout landed on the registered task def
  # and the ALB targets are healthy, then hits the service's health endpoint.
  # ---------------------------------------------------------------------------

  deploy-api:
    name: Build, Push & Deploy API
    needs: setup
    if: needs.setup.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Reads the layer cache CI's docker-build job writes on every push to
      # main (same scope) instead of building cold. No cache-to. provenance:
      # false keeps a plain single-manifest image, as `docker build` +
      # `docker push` produced.
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=ci-api

      - name: Image reference
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ssb-api-staging \
            --region $AWS_REGION \
            --query taskDefinition \
            --output json > task-def.json

      - name: Render task definition with new image
        id: new-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@6853cfae8c3a7d978fbf68b5a55453395541dfbb # v1.8.5
        with:
          task-definition: task-def.json
          container-name: api
          image: ${{ steps.build.outputs.image }}

      - name: Run database migrations
        if: needs.setup.outputs.migrations == 'true'
        run: |
          set -euo pipefail
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$(cat ${{ steps.new-task-def.outputs.task-definition }} | \
              jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')" \
            --region $AWS_REGION \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "Migration task def: $TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-0374aa2ad1df7a431,subnet-04e50152fa2b77b88],securityGroups=[sg-0e6b76b9c1c50d397],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","node_modules/typeorm/cli.js","migration:run","-d","dist/src/database/data-source.js"]}]}' \
            --region $AWS_REGION \
            --query tasks[0].taskArn \
            --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks "$TASK_ARN" --region $AWS_REGION

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER --tasks "$TASK_ARN" --region $AWS_REGION \
            --query "tasks[0].containers[?name=='api'].exitCode | [0]" --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed (exit $EXIT_CODE). Logs: aws logs tail /ecs/ssb-api-staging --follow"
            exit 1
          fi
          echo "✅ Migrations succeeded"

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@a310a830f5c14e583e35d84e4e1ec7dd177c3c9c # v2.6.2
        with:
          task-definition: ${{ steps.new-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ECS deployment landed (catches silent rollback)
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: bash .github/scripts/verify-ecs-deployment.sh

      - name: Smoke test API /health
        env:
          URL: ${{ env.API_SMOKE_URL }}
          LABEL: api
        run: bash .github/scripts/smoke-test-url.sh

  # ---------------------------------------------------------------------------
  # SSR smoke gate — boots each affected WEB_COMPUTE app's BUILT compute server
  # in the runner and asserts its homepage responds (<500, no hang) BEFORE the
  # Amplify deploy jobs run. Catches "compiles clean but hangs/5xx at runtime"
  # regressions that build/typecheck/unit all miss — e.g. the 2026-05-31 outage
  # where a transitive @tanstack/react-start bump hung landing's createServerFn
  # SSR path (30s timeout → 500). amplify-landing needs this
  # job, so a failure here BLOCKS the deploy and staging stays on the last good
  # version. forms is static (WEB) — no compute server to smoke.
  # ---------------------------------------------------------------------------
  ssr-smoke:
    name: SSR smoke (web-compute apps)
    needs: setup
    if: |
      needs.setup.outputs.landing == 'true'
      || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Smoke landing
        if: needs.setup.outputs.landing == 'true' || needs.setup.outputs.amplify-config == 'true'
        env:
          # landing's prebuild fetches the live form manifest; point it at the
          # staging API so the build resolves against the env it deploys into.
          VITE_FORMS_API_URL: https://api.staging.alpha.gov.bb
          # Since #1675, a production landing build throws on a request if these
          # are unset, so the smoke returned 500. Same values as the staging
          # landing Amplify app (d3u4q4kqt5t6ok).
          VITE_FORMS_URL: https://forms.staging.alpha.gov.bb
          VITE_CHAT_URL: https://chat.staging.alpha.gov.bb
        run: |
          pnpm exec nx build landing
          node .github/scripts/ssr-smoke.mjs apps/landing/.amplify-hosting/compute/default landing

  # ---------------------------------------------------------------------------
  # Amplify deploys — auto-build is OFF on the staging branch (per app IaC),
  # so this workflow is the sole trigger. Each job runs start-job → monitor →
  # URL smoke test. The smoke test catches "build succeeded but URL doesn't
  # serve" (same pattern as sandbox commit ab003dd9).
  #
  # amplify-landing also `needs: ssr-smoke` — a runtime hang there
  # blocks the deploy entirely, so a broken SSR build never reaches the live URL.
  # ---------------------------------------------------------------------------

  amplify-forms:
    name: Amplify build (forms)
    needs: setup
    if: needs.setup.outputs.forms == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          AMPLIFY_APP_ID: d27gpzyoit5nrf
          AMPLIFY_BRANCH: staging
          APP_LABEL: forms
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test forms URL
        env:
          URL: ${{ env.AMPLIFY_FORMS_URL }}
          LABEL: forms
        run: bash .github/scripts/smoke-test-url.sh

  amplify-landing:
    name: Amplify build (landing)
    needs: [setup, ssr-smoke]
    if: needs.setup.outputs.landing == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          AMPLIFY_APP_ID: d3u4q4kqt5t6ok
          AMPLIFY_BRANCH: staging
          APP_LABEL: landing
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test landing URL
        env:
          URL: ${{ env.AMPLIFY_LANDING_URL }}
          LABEL: landing
        run: bash .github/scripts/smoke-test-url.sh

  # Feature-flagging admin UI (apps/feature_flagging SSR) at
  # feature-flagging.staging.alpha.gov.bb. Gives staging a way to change a
  # service's status before prod (gov-bb#2755). App created by alpha-infra#700.
  amplify-feature-flagging:
    name: Amplify build (feature-flagging)
    needs: setup
    if: needs.setup.outputs.ff-app == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger and monitor Amplify build
        env:
          # gov-bb-feature-flagging-staging, created by alpha-infra#700.
          AMPLIFY_APP_ID: d15rkwf3l5cmbx
          AMPLIFY_BRANCH: staging
          APP_LABEL: feature-flagging
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test feature-flagging URL
        env:
          URL: ${{ env.AMPLIFY_FEATURE_FLAGGING_URL }}
          LABEL: feature-flagging
          # Auth-gated: an unauthenticated request redirects
          # to the GitHub login flow. A redirect means the SSR is alive.
          EXPECT_CODES: "200,302,307"
        run: bash .github/scripts/smoke-test-url.sh

  # ---------------------------------------------------------------------------
  # api_v2 and editor_v2 (#3130). Infrastructure: alpha-infra
  # environments/staging/simple-service-builder-staging/api-v2.tf and
  # amplify-editor-v2.tf (#821). Same steps as deploy-api-v2-sandbox.yml and
  # deploy-editor-v2-sandbox.yml, with this workflow's staging role, which
  # covers the gov-bb-api-v2 ECR repo and passes the gov-bb-api-v2-* roles.
  #
  # api_v2 applies its own drizzle migrations at boot, before it listens, so
  # there is no migration task. Its first boot on staging's empty database runs
  # the full baseline; the content then needs loading once (import-estate),
  # which is not part of this workflow.
  # ---------------------------------------------------------------------------

  deploy-api-v2:
    name: Build, Push & Deploy api_v2
    needs: setup
    if: needs.setup.outputs.api-v2 == 'true'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: gov-bb-api-v2
      ECS_SERVICE: api-v2-staging
      TASK_FAMILY: api-v2-staging
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # :latest as well as the SHA: tofu's task definition revision 1 points
      # at :latest. Reads sandbox's layer cache; no cache-to.
      - name: Build and push api_v2 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api_v2/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=deploy-api-v2-sandbox

      # Copy the live task definition (env, secrets and roles are tofu's) and
      # change only the image. Nothing from it is printed: the secret ARNs are
      # in there. The service starts at desired_count 0 in tofu (which ignores
      # later changes to it), so this sets it to 1.
      - name: Register task definition and roll the service
        id: deploy
        env:
          NEW_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-def.json

          jq --arg img "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $img | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def.json > task-def-new.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-new.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "Registered $TASK_DEF_ARN"
          echo "task-definition-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --query "service.deployments[0].rolloutState" \
            --output text

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify ECS deployment landed (catches silent rollback)
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: bash .github/scripts/verify-ecs-deployment.sh

      # /health/db proves the database answers; /categories proves a database
      # read through the public routes. The sandbox job also checks a seeded
      # page, which waits here until staging's content is imported.
      - name: Smoke test api_v2
        run: |
          set -euo pipefail
          for path in /health/db /docs/openapi.json /categories; do
            URL="$API_V2_URL$path" LABEL="api_v2 $path" bash .github/scripts/smoke-test-url.sh
          done

  amplify-editor-v2:
    name: Amplify build (editor_v2)
    needs: setup
    if: needs.setup.outputs.editor-v2 == 'true' || needs.setup.outputs.amplify-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      # The build bakes in VITE_API_ORIGIN, an app variable tofu sets, and the
      # apps/editor_v2 entry in amplify.yml fails it when that is unset.
      - name: Trigger and monitor Amplify build
        env:
          # gov-bb-editor-v2-staging, created by alpha-infra#821.
          AMPLIFY_APP_ID: dj9csf225uuh2
          AMPLIFY_BRANCH: staging
          APP_LABEL: editor_v2
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE --region "$AWS_REGION" \
            --query jobSummary.jobId --output text)
          echo "Amplify $APP_LABEL job: $JOB_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --region "$AWS_REGION" \
              --query job.summary.status --output text)
            echo "[$i/30] $APP_LABEL: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "✅ Amplify $APP_LABEL build succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "❌ Amplify $APP_LABEL build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          echo "❌ Amplify $APP_LABEL build did not finish in 15 min"
          exit 1

      - name: Smoke test editor_v2 URL
        env:
          URL: ${{ env.AMPLIFY_EDITOR_V2_URL }}
          LABEL: editor_v2
          # The CDN can serve nothing for a few seconds after SUCCEED.
          SLEEP_SECONDS: "10"
        run: bash .github/scripts/smoke-test-url.sh

  # Journey 1 on staging (#3008): each spec opens its landing start page, follows
  # Start to the form, submits it and checks the reference. A Start link to the
  # wrong host or form fails the run. Runs on every staging deploy, even when
  # nothing changed, because Deploy Production only ships a commit whose staging
  # run passed it (see deploy-prod.yml). Same forms and throttle budget as the
  # sandbox matrix, not every public form; keep the two lists in step.
  #
  # SMOKE_SUBMISSION_TOKEN_STAGING must match the staging API's
  # SMOKE_SUBMISSION_TOKEN (#3324). With a mismatch the API ignores the header
  # and every processor fires, sending real emails from staging.
  smoke-test-forms:
    name: Smoke test forms
    # ssr-smoke is listed directly: when it fails, amplify-landing is skipped
    # (not failed), so without it this would smoke the previous landing build
    # and the prod guard would accept a commit whose landing never deployed.
    needs: [setup, deploy-api, ssr-smoke, amplify-forms, amplify-landing]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - spec: project-protege-mentor.smoke.spec.ts
            artifact_name: project-protege-mentor-smoke-trace
          - spec: sports-training-programme-form-schema.smoke.spec.ts
            artifact_name: sports-training-programme-smoke-trace
          - spec: jobstart-plus-programme.smoke.spec.ts
            artifact_name: jobstart-plus-smoke-trace
          - spec: sell-goods-services-beach-park.smoke.spec.ts
            artifact_name: beach-park-smoke-trace
          - spec: get-birth-certificate.smoke.spec.ts
            artifact_name: get-birth-certificate-smoke-trace
          - spec: get-death-certificate.smoke.spec.ts
            artifact_name: get-death-certificate-smoke-trace
          - spec: get-marriage-certificate.smoke.spec.ts
            artifact_name: get-marriage-certificate-smoke-trace
    uses: ./.github/workflows/forms-smoke.yml
    with:
      base_url: https://forms.staging.alpha.gov.bb
      landing_url: https://staging.alpha.gov.bb
      spec: ${{ matrix.spec }}
      artifact_name: ${{ matrix.artifact_name }}
    secrets:
      smoke_submission_token: ${{ secrets.SMOKE_SUBMISSION_TOKEN_STAGING }}

  # Preview token (#3781): the same check as deploy-sandbox.yml's
  # preview-token job, against staging. RECIPE_PREVIEW_TOKEN_STAGING must equal
  # staging's api v1 RECIPE_PREVIEW_TOKEN, api_v2 PREVIEW_SECRET and landing
  # PREVIEW_SECRET. Unset, the check fails closed. Landing is checked only once
  # it reads api_v2 (#3227). ssr-smoke is listed for the same reason as in
  # smoke-test-forms: when it fails, amplify-landing is skipped, not failed.
  # Steps and checks: scripts/check-preview-token.ts.
  preview-token:
    name: Preview token matches (api v1, api_v2, landing)
    needs: [setup, deploy-api, ssr-smoke, amplify-landing, deploy-api-v2]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check the preview token
        env:
          PREVIEW_TOKEN: ${{ secrets.RECIPE_PREVIEW_TOKEN_STAGING }}
          API_V1_URL: https://api.staging.alpha.gov.bb
          API_V2_URL: ${{ env.API_V2_URL }}
          LANDING_URL: ${{ env.AMPLIFY_LANDING_URL }}
        run: |
          echo "::add-mask::$PREVIEW_TOKEN"
          pnpm tsx scripts/check-preview-token.ts

  # Journey 5 (#3012): pay for a certificate through the EZ Pay test host on
  # staging and check the confirmation (and, once the test inbox exists, the
  # confirmation email). Runs after the API + forms deploys — and on every run,
  # even when neither changed, because Deploy Production requires it to have
  # passed for the commit it ships.
  #
  # OFF until the repo variable E2E_PAYMENTS_ENABLED=true (needs the EZ Pay
  # test card secrets and EZ Pay set in staging's form_config). While off this
  # job is skipped, the staging run stays green, and the prod gate is off too.
  # The email check also needs the test inbox (vars.E2E_INBOX_BUCKET); without
  # it the journey stops at the confirmation page.
  #
  # No X-Smoke-Submission header: that token drops the payment, so every
  # processor fires: a green run leaves one real, paid test submission on
  # staging AND sends the MDA notification to staging's form_config mdaEmail
  # for get-death-certificate — make sure that is a test inbox before enabling.
  journey-5-payments:
    # Deploy Production's guard finds this job by its name starting with
    # "Journey 5" — keep that prefix if you rename it.
    name: Journey 5 (EZ Pay payment → confirmation)
    needs: [setup, deploy-api, amplify-forms]
    if: |
      always() &&
      vars.E2E_PAYMENTS_ENABLED == 'true' &&
      needs.setup.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The spec skips itself without a card, so a missing secret must fail
      # here rather than pass the gate with nothing tested.
      - name: Require the EZ Pay test card
        env:
          CARD_NUMBER: ${{ secrets.E2E_EZPAY_CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.E2E_EZPAY_CARD_EXPIRY }}
          CARD_CVV: ${{ secrets.E2E_EZPAY_CARD_CVV }}
        run: |
          if [ -z "$CARD_NUMBER" ] || [ -z "$CARD_EXPIRY" ] || [ -z "$CARD_CVV" ]; then
            echo "::error::Set the E2E_EZPAY_CARD_NUMBER / _EXPIRY / _CVV secrets (the EZ Pay test-host card)."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @govtech-bb/forms exec playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "could not resolve playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/forms exec playwright install chromium
      - name: Configure AWS credentials (test inbox, read-only)
        if: vars.E2E_INBOX_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.E2E_INBOX_ROLE_ARN }}
          aws-region: ${{ vars.E2E_INBOX_REGION }}
      - name: Run journey 5
        env:
          SMOKE_BASE_URL: ${{ env.AMPLIFY_FORMS_URL }}
          # The workflow-level AWS_REGION (ca-central-1) would otherwise win over
          # the inbox region configure-aws-credentials sets.
          AWS_REGION: ${{ vars.E2E_INBOX_REGION || env.AWS_REGION }}
          E2E_EZPAY_CARD_NUMBER: ${{ secrets.E2E_EZPAY_CARD_NUMBER }}
          E2E_EZPAY_CARD_EXPIRY: ${{ secrets.E2E_EZPAY_CARD_EXPIRY }}
          E2E_EZPAY_CARD_CVV: ${{ secrets.E2E_EZPAY_CARD_CVV }}
          E2E_INBOX_DOMAIN: ${{ vars.E2E_INBOX_DOMAIN }}
          E2E_INBOX_BUCKET: ${{ vars.E2E_INBOX_BUCKET }}
          E2E_INBOX_PREFIX: ${{ vars.E2E_INBOX_PREFIX }}
        run: >
          pnpm --filter @govtech-bb/forms exec playwright test
          --config playwright.smoke.config.ts
          journey-5-ezpay.smoke.spec.ts
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-5-ezpay-trace
          path: apps/forms/test-results/
          retention-days: 7

  # Journey 4 (#3011/#3861): a submission reaches case-management (CaMS) and
  # back. Submits a dedicated non-public test form (`e2e-j4-case-check`) whose
  # webhook maps to a reserved `E2E_` test programme, then follows it into CaMS,
  # asserts the case (same reference code + uploaded file copied), and removes
  # the test case.
  #
  # Auth / env model. The submit carries the smoke token (X-Smoke-Submission, set
  # on the journey config): under ADR 0087's amendment that drops every processor
  # EXCEPT a mapped webhook to a reserved `E2E_` test programme, so no real email,
  # payment or real-programme webhook fires. The webhook resolves its destination
  # from MDA_WEBHOOK_DESTINATIONS for the form's ministry key (`E2E`), which on
  # STAGING points at a NON-PROD CaMS (ADR 0087 environment scope — do NOT enable
  # the smoke token in prod expecting zero CaMS traffic). CaMS registers every
  # `E2E_` programme as `isTest`, so the case created is removable, never real.
  # E2E_CAMS_API_KEY is the CaMS x-api-key for that test programme.
  #
  # SOFT-SKIP (the #3536 lesson). The CaMS read + removeTestCase endpoints this
  # journey needs are a PROPOSED contract (CaMS exposes only POST /api/cases
  # today, see apps/forms/e2e/helpers/cams-client.ts) and are not provisioned
  # yet. So the run step soft-skips (warning + `exit 0`, NOT exit 1) when
  # E2E_CAMS_API_KEY is empty: the job goes green and never blocks the deploy
  # while J4 is dormant. This job is deliberately NOT in the `summary` job's
  # `needs`, and NOT in Deploy Production's gate — once provisioning lands,
  # RE-ARM it fail-closed (error + exit 1 on an empty key) and add the prod gate,
  # matching Journey 5's pattern. Full pointer: docs/e2e-j4-case-management.md.
  journey-case-management:
    name: Journey 4 (submission → case management)
    # Deploy Staging runs only on workflow_dispatch (promoted from sandbox on
    # `staging`, or manual from the Actions tab) — never `push` — so gate on the
    # deploy's success, exactly like smoke-test-forms / journey-5-payments. A
    # `github.event_name == 'push'` guard would make this never run.
    needs: [setup, deploy-api, amplify-forms]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # E2E_CAMS_API_KEY lives in this GitHub Environment, visible only to a job
    # that declares it. This job assumes no AWS role, so the environment adds no
    # OIDC behaviour.
    environment: staging-e2e
    # The case poll is budgeted to ~90s in the spec; this 15m is a backstop
    # against a hang (install + browser), not a performance budget.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter @govtech-bb/forms exec playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "could not resolve playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/forms exec playwright install chromium
      - name: Run Journey 4
        env:
          # All via env (not inline ${{ }}) so nothing is interpolated into the
          # shell. The tokens are secrets; the URLs are fixed staging hosts.
          SMOKE_BASE_URL: https://forms.staging.alpha.gov.bb
          SMOKE_LANDING_URL: https://staging.alpha.gov.bb
          PREVIEW_TOKEN: ${{ secrets.RECIPE_PREVIEW_TOKEN }}
          # The staging smoke token (shared with smoke-test-forms) — it must match
          # staging's API SMOKE_SUBMISSION_TOKEN, else the API ignores the header
          # and the run submits for real instead of as a smoke test (#3324).
          SMOKE_SUBMISSION_TOKEN: ${{ secrets.SMOKE_SUBMISSION_TOKEN_STAGING }}
          E2E_CAMS_BASE_URL: https://cases.staging.alpha.gov.bb
          E2E_CAMS_API_KEY: ${{ secrets.E2E_CAMS_API_KEY }}
        run: |
          if [ -z "$E2E_CAMS_API_KEY" ]; then
            echo "::warning::E2E_CAMS_API_KEY not set — J4 not yet provisioned (see docs/e2e-j4-case-management.md); skipping."
            exit 0
          fi
          pnpm --filter @govtech-bb/forms exec playwright test \
            --config playwright.journey.config.ts \
            journey-4-case-management.spec.ts
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-4-case-management-trace
          path: apps/forms/test-results/
          retention-days: 7

  summary:
    name: Deployment summary
    needs:
      [
        setup,
        deploy-api,
        ssr-smoke,
        amplify-forms,
        amplify-landing,
        amplify-feature-flagging,
        deploy-api-v2,
        amplify-editor-v2,
        smoke-test-forms,
        journey-5-payments,
        preview-token,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          # Via env, not inline ${{ }} in the script (zizmor template-injection).
          SMOKE_RESULT: ${{ needs.smoke-test-forms.result }}
          PREVIEW_TOKEN_RESULT: ${{ needs.preview-token.result }}
        run: |
          row() {
            local label="$1" result="$2"
            case "$result" in
              success) echo "| $label | ✅ deployed |" ;;
              failure) echo "| $label | ❌ FAILED |" ;;
              skipped) echo "| $label | ⏭ skipped (unaffected) |" ;;
              cancelled) echo "| $label | ⚠ cancelled |" ;;
              *) echo "| $label | $result |" ;;
            esac
          }

          {
            echo "## Staging Deployment Summary"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "| Target | Result |"
            echo "|--------|--------|"
            row "SSR smoke (pre-deploy)" "${{ needs.ssr-smoke.result }}"
            row "API"                  "${{ needs.deploy-api.result }}"
            row "Amplify forms"        "${{ needs.amplify-forms.result }}"
            row "Amplify landing"      "${{ needs.amplify-landing.result }}"
            row "Amplify feature-flagging" "${{ needs.amplify-feature-flagging.result }}"
            row "api_v2"               "${{ needs.deploy-api-v2.result }}"
            row "Amplify editor_v2"    "${{ needs.amplify-editor-v2.result }}"
            row "Forms smoke (J1)"     "$SMOKE_RESULT"
            row "Journey 5 (EZ Pay)"   "${{ needs.journey-5-payments.result }}"
            row "Preview token check"  "$PREVIEW_TOKEN_RESULT"
            echo ""
            echo "**URLs (ALB / amplifyapp.com until DNS lands):**"
            echo "- API: ${{ env.API_SMOKE_URL }}"
            echo "- forms: ${{ env.AMPLIFY_FORMS_URL }}"
            echo "- landing: ${{ env.AMPLIFY_LANDING_URL }}"
            echo "- feature-flagging: ${{ env.AMPLIFY_FEATURE_FLAGGING_URL }}"
            echo "- api_v2: ${{ env.API_V2_URL }}"
            echo "- editor_v2: ${{ env.AMPLIFY_EDITOR_V2_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
