name: Landing v2 Smoke

# Post-deploy smoke of sandbox landing served from api_v2 (#3305: #3140,
# #3143, #3144; #3851). After each Deploy Sandbox run that deployed landing
# or api_v2 from main, it checks https://sandbox.alpha.gov.bb:
#
# - every known api_v2 page comes back `x-content-source: api_v2`, so a
#   broken, stale or empty api_v2 can't hide behind landing's static fallback;
# - every api_v2 page bound to a form opens that form's first step from its
#   Start link. Nothing is submitted;
# - visibility gating: preview pages 404 for the public, and a page whose form
#   is under maintenance, form_disabled or closed shows its notice, no Start
#   link, and a 404 `/start` step.
#
# The gate job skips the smoke with a notice, and stays green, when:
# - the Deploy Sandbox run failed or deployed neither landing nor api_v2;
# - a newer Deploy Sandbox run on main is queued or in progress. Its
#   completion runs the check again. Caveat: if that newer run deploys
#   neither landing nor api_v2, the check waits for the next one that does;
# - a sampled page answers `x-content-source: static` and none answers
#   from api_v2, so landing doesn't read api_v2 yet (as before #3311).
# A manual run skips only for the last reason. Every other answer runs the
# smoke: `api_v2-stale` and `static-fallback` mean api_v2 failed, and no
# header, a 5xx, a timeout or an empty catalog mean landing or api_v2 is
# broken (with a warning), so the smoke goes red on a real outage.
# Scripts: apps/landing/e2e/smoke.

on:
  # Deploy Sandbox runs only on a push to main or by hand, and this workflow
  # checks out main, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Sandbox]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  SMOKE_LANDING_URL: https://sandbox.alpha.gov.bb
  SMOKE_API_V2_URL: https://api.sandbox.alpha.gov.bb/v2
  # Must equal the Amplify sandbox branch's VITE_FORMS_URL: the walk looks
  # for Start links to exactly <this>/forms/<form_id>.
  SMOKE_FORMS_URL: https://forms.sandbox.alpha.gov.bb
  # Must equal the Amplify sandbox branch's VITE_FORMS_API_URL: the
  # visibility check reads the same maintenance, closed and service-status
  # lists landing gates on.
  SMOKE_FORMS_API_URL: https://forms.api.sandbox.alpha.gov.bb

jobs:
  gate:
    name: Gate (landing or api_v2 deployed, landing serves api_v2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read the triggering Deploy Sandbox run's jobs
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide whether to smoke
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::Skipped: $1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A manual run smokes whatever sandbox serves now.
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$CONCLUSION" != "success" ]; then
              skip "Deploy Sandbox run $RUN_ID concluded $CONCLUSION"
            fi
            NEWER=$(gh api "repos/$REPO/actions/workflows/deploy-sandbox.yml/runs?branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.id > $RUN_ID and .status != \"completed\")] | length")
            if [ "$NEWER" != "0" ]; then
              skip "a newer Deploy Sandbox run on main is queued or in progress; its completion runs this check"
            fi
            # A reusable-workflow job is named "Deploy api_v2 / <its job>".
            DEPLOYED=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success")
                | select(.name == "Amplify build (landing)" or (.name | startswith("Deploy api_v2"))) | .name')
            if [ -z "$DEPLOYED" ]; then
              skip "Deploy Sandbox run $RUN_ID deployed neither landing nor api_v2"
            fi
            echo "Deploy Sandbox run $RUN_ID deployed:"
            echo "$DEPLOYED"
          fi

          # Up to 10 public api_v2 pages, so the few feature routes in the
          # catalog (no x-content-source, #3759) can't fill the sample.
          PAGES=$(curl -fsS --max-time 30 "$SMOKE_API_V2_URL/catalog" \
            | jq -r '[.pages[] | select(.visibility == "public") | .url][:10][]') || {
            echo "::error::Could not list public pages from $SMOKE_API_V2_URL/catalog."
            exit 1
          }
          run_smoke() {
            echo "::warning::Running the smoke: $1"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$PAGES" ]; then
            run_smoke "the catalog lists no public pages"
          fi
          STATIC=false
          OTHER=()
          HEADERS=$(mktemp)
          for path in $PAGES; do
            CODE=$(curl -sS -o /dev/null -D "$HEADERS" -w '%{http_code}' --max-time 15 \
              "$SMOKE_LANDING_URL$path?smoke-gate=$GITHUB_RUN_ID-$RANDOM") || {
              case $? in
                28) CODE="timeout" ;;
                6 | 7) CODE="unreachable" ;;
                *) CODE="curl failed" ;;
              esac
            }
            SOURCE=$(tr -d '\r' < "$HEADERS" | awk -F': *' 'tolower($1) == "x-content-source" { print $2 }')
            echo "$path: $CODE, x-content-source: ${SOURCE:-<none>}"
            case "$SOURCE" in
              api_v2 | api_v2-stale | static-fallback)
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              static) STATIC=true ;;
              *) OTHER+=("$path ($CODE, x-content-source: ${SOURCE:-none})") ;;
            esac
          done
          if [ "$STATIC" = "true" ]; then
            skip "sandbox landing serves static content, not api_v2 yet (#3311)"
          fi
          run_smoke "no sampled page answered static or api_v2: ${OTHER[*]}"

  smoke:
    name: Smoke (api_v2 source, Start links, visibility gating)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # On the smoke, not the workflow: a newer deploy of landing or api_v2
    # supersedes an older smoke, but a run the gate skips must not cancel one.
    # Per ref, so a manual run from a branch can't cancel main's.
    concurrency:
      group: landing-v2-smoke-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        # No --with-deps: ubuntu-latest already ships chromium's libraries,
        # and apt retries once wedged the queue (#2291, #2299).
        timeout-minutes: 10
        run: pnpm --filter @govtech-bb/landing exec playwright install chromium
      - name: Self-test (the checks fail on broken pages)
        run: pnpm --filter @govtech-bb/landing test:smoke --project selftest
      - name: Smoke sandbox landing
        env:
          # Must equal sandbox api_v2's PREVIEW_SECRET, so the visibility check
          # can list preview pages. Absent, the preview test fails in CI.
          SMOKE_API_V2_PREVIEW_TOKEN: ${{ secrets.RECIPE_PREVIEW_TOKEN }}
        run: pnpm --filter @govtech-bb/landing test:smoke --project live
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-v2-smoke-traces
          path: apps/landing/test-results/
          retention-days: 7
