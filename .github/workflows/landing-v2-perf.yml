name: Landing v2 perf

# Time to first byte of landing served from api_v2 (#3147) and of unknown
# URLs (#3149), in one k6 run against sandbox landing, deployed from main.
# Runs after each green Deploy Sandbox run that deployed landing or api_v2,
# and by hand. A failed budget turns this run red; it doesn't hold back a deploy.
# Budgets and URLs: apps/landing/perf/.
#
# The gate job skips the run, with a notice, and stays green, when:
#  - the Deploy Sandbox run failed or deployed neither landing nor api_v2;
#  - a newer Deploy Sandbox run on main is queued or in progress (its
#    completion re-runs this check; if that run deploys neither landing nor
#    api_v2, the check waits for the next one that does);
#  - a sampled page answers `x-content-source: static` and none reads api_v2
#    (as before #3311).
# A manual run skips only for the last reason. Every other answer runs the
# check: `api_v2`, `api_v2-stale` and `static-fallback` mean landing reads
# api_v2 (the last two: api_v2 failed). No header, a 5xx, a timeout, an
# unreachable landing, or a catalog with no public pages also run it, with a
# warning, so an outage goes red. Only a failed catalog fetch fails the gate.
# The sample leaves out landing's feature routes (`src/routes/**/-meta.ts`),
# which never send x-content-source.
#
# Static baseline: staging serves static content until the staging switch
# (#3227), so until then STAGING_URL makes each run compare sandbox with
# staging as well as with the fixed budgets. At #3227, delete the STAGING_URL
# line: the run then checks the fixed budgets only. No load ever goes to prod
# (decided in #3854). Until then the baseline can be noisy: a green Deploy
# Sandbox run starts the staging deploy, which can overlap this run.

on:
  # Deploy Sandbox runs only on a push to main or by hand, and this workflow
  # checks out main, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Sandbox]
    types: [completed]
  workflow_dispatch:

permissions: {}

env:
  PREVIEW_URL: https://sandbox.alpha.gov.bb
  API_V2_URL: https://api.sandbox.alpha.gov.bb/v2

jobs:
  gate:
    name: Check sandbox landing serves api_v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read the triggering Deploy Sandbox run's jobs
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # Only the feature-route list (`-meta.ts` files) is read; nothing runs.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/landing/src/routes
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::Skipped: $1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          run_with_warning() {
            echo "::warning::Running anyway: $1"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = workflow_run ]; then
            if [ "$DEPLOY_CONCLUSION" != success ]; then
              skip "Deploy Sandbox concluded '$DEPLOY_CONCLUSION', not success"
            fi
            # A reusable workflow's job is named "<caller> / <callee>" when it
            # runs ("Deploy api_v2 / ..."); only a skipped one is "Deploy api_v2".
            deployed=$(gh api "repos/$REPO/actions/runs/$DEPLOY_RUN_ID/jobs?per_page=100" --jq '
              [.jobs[]
                | select(.conclusion == "success")
                | select(.name == "Amplify build (landing)"
                    or (.name | startswith("Deploy api_v2 / ")))]
              | length')
            if [ "$deployed" = 0 ]; then
              skip "this Deploy Sandbox run deployed neither landing nor api_v2"
            fi
            newer=$(gh api "repos/$REPO/actions/workflows/deploy-sandbox.yml/runs?branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.id > $DEPLOY_RUN_ID and .status != \"completed\")] | length")
            if [ "$newer" != 0 ]; then
              skip "a newer Deploy Sandbox run is queued or in progress; its completion re-runs this check"
            fi
          fi

          # Up to 5 public catalog pages that aren't feature routes, asked for
          # unredirected and past any cache.
          features=$(cd apps/landing/src/routes && find . -name -meta.ts \
            | sed 's#^\.##; s#/-meta\.ts$##' | jq -R . | jq -sc .)
          catalog=$(curl -fsS --max-time 20 "$API_V2_URL/catalog") || {
            echo "::error::Could not fetch $API_V2_URL/catalog"
            exit 1
          }
          pages=$(jq -r --argjson features "$features" '[.pages[]?
            | select(.visibility == "public" and (.url | IN($features[]) | not))
            | .url][:5][]' <<< "$catalog") || {
            echo "::error::Could not read public pages from $API_V2_URL/catalog"
            exit 1
          }
          if [ -z "$pages" ]; then
            run_with_warning "$API_V2_URL/catalog lists no public pages to sample"
          fi

          static=false
          problems=()
          for page in $pages; do
            rc=0
            headers=$(curl -sS --max-time 20 -o /dev/null -D - \
              "$PREVIEW_URL$page?perf-gate=$GITHUB_RUN_ID-$RANDOM") || rc=$?
            if [ "$rc" = 28 ]; then
              problems+=("$page timed out")
              continue
            elif [ "$rc" != 0 ]; then
              problems+=("$page unreachable (curl exit $rc)")
              continue
            fi
            headers=$(printf '%s' "$headers" | tr -d '\r')
            status=$(head -n1 <<< "$headers" | awk '{ print $2 }')
            source=$(awk 'tolower($1) == "x-content-source:" { print $2 }' <<< "$headers")
            echo "$page: HTTP $status, x-content-source ${source:-(none)}"
            case "$source" in
              api_v2 | api_v2-stale | static-fallback)
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            if [[ "$status" == 5* ]]; then
              problems+=("$page answered HTTP $status")
            elif [ "$source" = static ]; then
              static=true
            else
              problems+=("$page answered HTTP $status with no x-content-source")
            fi
          done
          if [ "$static" = true ]; then
            skip "sandbox landing serves static content, not api_v2 yet (#3311)"
          fi
          run_with_warning "no sampled page answered static or api_v2: $(IFS=';'; echo "${problems[*]}")"

  ttfb:
    name: Landing TTFB (api_v2)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # One perf job at a time on any ref, so no host takes two loads at once.
    # A later run queues (the newest queued one wins) and never stops one
    # that is measuring. Job-level, so a run the gate skips never waits.
    concurrency:
      group: landing-v2-perf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      # ~10 minutes: 30 s warm-up, then 200 requests per URL at 10 a second
      # per host.
      - name: Run k6
        env:
          # Static baseline until #3227. Delete this line at #3227.
          STAGING_URL: https://staging.alpha.gov.bb
          OUT_DIR: ${{ runner.temp }}
        run: k6 run --quiet apps/landing/perf/ttfb.mjs

      - name: Check budgets
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '.pass == true' "$OUT_DIR/verdict.json" > /dev/null; then
            jq -r '.rows[] | select(.pass | not) | "::error::\(.budget): \(.actual), limit \(.limit)"' \
              "$OUT_DIR/verdict.json"
            exit 1
          fi
