name: Landing v2 perf

# Time to first byte of landing served from api_v2 (#3147) and of unknown
# URLs (#3149), in one k6 run against the v2-rewrite preview, with static
# landing on staging as the baseline. Runs after each Amplify build of
# v2-rewrite; a failed budget fails the run, which blocks the v2-rewrite ->
# main merge (#3131). After that merge, #3311 retargets PREVIEW_URL at
# landing.sandbox.alpha.gov.bb. Budgets and URLs: apps/landing/perf/.

on:
  push:
    branches: [v2-rewrite]
  workflow_dispatch:

permissions:
  id-token: write # list, read and start Amplify jobs via OIDC
  contents: read

# One run at a time, so staging never takes two loads at once. A newer push
# supersedes the older run.
concurrency:
  group: landing-v2-perf
  cancel-in-progress: true

# The api_v2 sandbox role trusts gov-bb v2-rewrite and main (the repo's
# AWS_ROLE_ARN secret doesn't trust v2-rewrite). alpha-infra grants it the
# Amplify job access the wait step needs on landing's v2-rewrite branch.
env:
  AWS_ROLE_ARN: arn:aws:iam::672203047922:role/api-v2-github-actions-sandbox
  # The build waited on and the host measured must be the same one.
  PREVIEW_URL: https://v2-rewrite.d3kbl8o0ovutw4.amplifyapp.com

jobs:
  ttfb:
    name: Landing TTFB (api_v2 vs static)
    # A dispatch from another branch would make the wait step start a
    # v2-rewrite build of that branch's commit.
    if: github.ref == 'refs/heads/v2-rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Wait for the Amplify build
        id: wait
        uses: ./.github/actions/wait-for-amplify-build
        with:
          app-id: d3kbl8o0ovutw4
          branch: v2-rewrite
          sha: ${{ github.sha }}
          url: ${{ env.PREVIEW_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up k6
        if: steps.wait.outputs.superseded != 'true'
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      # ~10 minutes: 30 s warm-up, then 200 requests per URL at 10 a second
      # per host.
      - name: Run k6
        if: steps.wait.outputs.superseded != 'true'
        env:
          STAGING_URL: https://staging.alpha.gov.bb
          OUT_DIR: ${{ runner.temp }}
        run: k6 run --quiet apps/landing/perf/ttfb.mjs

      - name: Check budgets
        if: steps.wait.outputs.superseded != 'true'
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '.pass == true' "$OUT_DIR/verdict.json" > /dev/null; then
            jq -r '.rows[] | select(.pass | not) | "::error::\(.budget): \(.actual), limit \(.limit)"' \
              "$OUT_DIR/verdict.json"
            exit 1
          fi
