name: Landing v2 perf

# Time to first byte of landing served from api_v2 (#3147) and of unknown
# URLs (#3149), in one k6 run against sandbox landing, deployed from main.
# Runs after each green Deploy Sandbox run that deployed landing or api_v2,
# and by hand. A failed budget turns this run red; it doesn't hold back a deploy.
# Budgets and URLs: apps/landing/perf/.
#
# The gate job probes up to 5 public catalog pages (leaving out landing's
# feature routes, `src/routes/**/-meta.ts`, which never send
# x-content-source), then decides, the same way as landing-v2-parity.yml and
# landing-v2-smoke.yml:
#  - any page answers `api_v2`, `api_v2-stale` or `static-fallback` (landing
#    reads api_v2; the last two mean api_v2 failed): run;
#  - otherwise any page answers `static` (as before #3311): skip, green;
#  - otherwise (no header, a 5xx, a timeout, landing unreachable, or no public
#    pages): run, with a warning per case, so an outage goes red.
# A failed catalog fetch fails the gate. On workflow_run it also skips, green,
# when the Deploy Sandbox run failed or deployed neither landing nor api_v2,
# or while a newer Deploy Sandbox run on main is queued or in progress (its
# completion re-runs this check; if that run deploys neither landing nor
# api_v2, the check waits for the next one that does).
#
# Static baseline: staging serves static content until the staging switch
# (#3227), so until then STAGING_URL makes each run compare sandbox with
# staging as well as with the fixed budgets. At #3227, delete the STAGING_URL
# line: the run then checks the fixed budgets only. No load ever goes to prod
# (decided in #3854). Until then the baseline can be noisy: a green Deploy
# Sandbox run starts the staging deploy, which can overlap this run.

on:
  # Deploy Sandbox runs only on a push to main or by hand, and this workflow
  # checks out main, never the triggering run's code, and reads no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Deploy Sandbox]
    types: [completed]
  workflow_dispatch:

permissions: {}

env:
  PREVIEW_URL: https://sandbox.alpha.gov.bb
  CATALOG_URL: https://api.sandbox.alpha.gov.bb/v2/catalog

jobs:
  gate:
    name: Check sandbox landing serves api_v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # read Deploy Sandbox runs and their jobs
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout landing routes
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/landing/src/routes
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          run_check() {
            [ -z "${1:-}" ] || echo "::warning::$1"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = workflow_run ]; then
            [ "$CONCLUSION" = success ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID concluded '$CONCLUSION', not success."
            # A reusable workflow's jobs are named "Deploy api_v2 / <job>".
            deployed="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success") | select(.name == "Amplify build (landing)" or (.name | startswith("Deploy api_v2"))) | .name')"
            [ -n "$deployed" ] ||
              skip "Skipped: Deploy Sandbox run $RUN_ID deployed neither landing nor api_v2."
            newer="$(gh api "repos/$REPO/actions/workflows/deploy-sandbox.yml/runs?branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.id > $RUN_ID and .status != \"completed\")] | length")"
            [ "$newer" = 0 ] ||
              skip "Skipped: a newer Deploy Sandbox run is deploying; its completion re-runs this check."
          fi
          # Feature routes carry no x-content-source, so they prove nothing.
          features="$(find apps/landing/src/routes -name '-meta.ts' |
            sed -e 's#^apps/landing/src/routes##' -e 's#/-meta\.ts$##' | jq -R . | jq -s .)"
          paths="$(curl -fsS --max-time 30 "$CATALOG_URL" |
            jq -r --argjson features "$features" \
              '[.pages[] | select(.visibility == "public") | .url | select(IN($features[]) | not)][:5][]')" || {
            echo "::error::Could not list public pages from $CATALOG_URL."
            exit 1
          }
          [ -n "$paths" ] ||
            run_check "$CATALOG_URL lists no public pages besides feature routes; running the check."
          headers="$(mktemp)"
          api_v2=false
          static=false
          for path in $paths; do
            rc=0
            status="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 30 \
              "$PREVIEW_URL$path?perf-gate=$GITHUB_RUN_ID-$RANDOM")" || rc=$?
            if [ "$rc" = 28 ]; then
              echo "::warning::$path: sandbox landing timed out."
              continue
            elif [ "$rc" != 0 ]; then
              echo "::warning::$path: sandbox landing unreachable (curl exit $rc)."
              continue
            fi
            source="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1) == "x-content-source" { print $2 }')"
            echo "$path: HTTP $status, x-content-source ${source:-(none)}"
            if [[ "$source" =~ ^(api_v2|api_v2-stale|static-fallback)$ ]]; then
              api_v2=true
            elif [ "$source" = static ]; then
              static=true
            elif [ "$status" -ge 500 ]; then
              echo "::warning::$path: sandbox landing answered HTTP $status."
            else
              echo "::warning::$path: sandbox landing answered HTTP $status with no x-content-source."
            fi
          done
          [ "$api_v2" = true ] && run_check
          [ "$static" = true ] &&
            skip "Skipped: sandbox landing serves static content, not api_v2 yet (#3311)."
          run_check "No sampled page answered static or api_v2; running the check."

  ttfb:
    name: Landing TTFB (api_v2)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # One perf job at a time on any ref, so no host takes two loads at once.
    # A later run queues (the newest queued one wins) and never stops one
    # that is measuring. Job-level, so a run the gate skips never waits.
    concurrency:
      group: landing-v2-perf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0

      # ~10 minutes: 30 s warm-up, then 200 requests per URL at 10 a second
      # per host.
      - name: Run k6
        env:
          # Static baseline until #3227. Delete this line at #3227.
          STAGING_URL: https://staging.alpha.gov.bb
          OUT_DIR: ${{ runner.temp }}
        run: k6 run --quiet apps/landing/perf/ttfb.mjs

      - name: Check budgets
        env:
          OUT_DIR: ${{ runner.temp }}
        run: |
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '.pass == true' "$OUT_DIR/verdict.json" > /dev/null; then
            jq -r '.rows[] | select(.pass | not) | "::error::\(.budget): \(.actual), limit \(.limit)"' \
              "$OUT_DIR/verdict.json"
            exit 1
          fi
