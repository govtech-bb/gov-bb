version: 1
applications:
  - appRoot: apps/landing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run landing:build
      artifacts:
        baseDirectory: apps/landing/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        # Public renderer assets contain no draft data or credentials. The CMS
        # imports this entry across origins; ordinary page responses are unchanged.
        - pattern: "/cms-preview/**"
          headers:
            - key: "Access-Control-Allow-Origin"
              value: "*"
            - key: "Cache-Control"
              value: "no-cache"
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            # frame-ancestors allows the form_builder's /content live preview to
            # embed this app (modern browsers ignore X-Frame-Options when
            # frame-ancestors is present; DENY stays as the legacy fallback).
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(self), payment=()"
            # script-src includes https://cloud.umami.is so the Umami Cloud
            # analytics script loads. Without it the browser blocks the fetch
            # and the script tag (rendered from VITE_UMAMI_WEBSITE_ID) never
            # executes — see issue #1364 follow-up.
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https:; frame-ancestors https://*.alpha.gov.bb; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
  - appRoot: apps/chat
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run chat:build
      artifacts:
        baseDirectory: apps/chat/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
  - appRoot: apps/forms
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run forms:build
      artifacts:
        baseDirectory: apps/forms/dist
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            # script-src includes https://cloud.umami.is so the Umami Cloud
            # analytics script loads. Without it the browser blocks the fetch
            # and the script tag (rendered from VITE_UMAMI_WEBSITE_ID) never
            # executes — see issue #1364 follow-up.
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
  - appRoot: apps/form_builder
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run form-builder-app:build
      artifacts:
        baseDirectory: apps/form_builder/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            # frame-src allows the /content editor's live preview iframe of the
            # landing app's /preview-start-page route. connect-src allows the
            # browser's direct calls to BUILDER_API_URL/builder/ai/* (#3027);
            # img-src blob: allows the AI attachment (PDF/image) thumbnails.
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://forms.api.sandbox.alpha.gov.bb https://api.github.com https://github.com https://*.s3.ca-central-1.amazonaws.com; frame-src 'self' https://*.alpha.gov.bb; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'; upgrade-insecure-requests"
  - appRoot: apps/feature_flagging
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run feature-flagging-app:build
      artifacts:
        baseDirectory: apps/feature_flagging/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            # No iframes and no third-party browser calls: the SSR server talks
            # to the forms API and GitHub; the browser only hits same-origin
            # server functions. GitHub hosts are allowed for the OAuth redirect.
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com https://github.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com; object-src 'none'; upgrade-insecure-requests"
  - appRoot: apps/analytics
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - pnpm exec nx run analytics-app:build
      artifacts:
        baseDirectory: apps/analytics/.amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
  # editor_v2 is a static SPA (TanStack Start, spa mode) on a WEB Amplify app,
  # gov-bb-editor-v2-sandbox (gov-bb#2962). Commands run from the repo root.
  - appRoot: apps/editor_v2
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use $(cat .nvmrc) || nvm install $(cat .nvmrc)
            - npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            # VITE_API_ORIGIN (the api_v2 origin) is baked into the bundle, and
            # the app throws on load without it. Fail the build instead.
            - 'if [ -z "$VITE_API_ORIGIN" ]; then echo "VITE_API_ORIGIN is not set on this Amplify app"; exit 1; fi'
            - pnpm exec nx run editor_v2:build
            # The SPA shell is emitted as _shell.html. Amplify serves index.html
            # at "/", and the app's 404-200 rewrite sends deep links there.
            - cp apps/editor_v2/dist/client/_shell.html apps/editor_v2/dist/client/index.html
      artifacts:
        baseDirectory: apps/editor_v2/dist/client
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: "Strict-Transport-Security"
              value: "max-age=63072000; includeSubDomains; preload"
            - key: "X-Content-Type-Options"
              value: "nosniff"
            - key: "Referrer-Policy"
              value: "strict-origin-when-cross-origin"
            - key: "X-Frame-Options"
              value: "DENY"
            - key: "Permissions-Policy"
              value: "camera=(), microphone=(), geolocation=(), payment=()"
            # 'unsafe-inline' scripts: the shell carries TanStack's inline
            # hydration bootstrap. connect-src: the browser calls api_v2
            # (api-v2.<env>.alpha.gov.bb) with the session cookie.
            - key: "Content-Security-Policy"
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://alpha.gov.bb https://*.alpha.gov.bb; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://alpha.gov.bb https://*.alpha.gov.bb; font-src 'self' data:; connect-src 'self' https://alpha.gov.bb https://*.alpha.gov.bb; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
