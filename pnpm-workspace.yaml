packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 supply-chain hardening: no git/URL deps in the transitive graph.
# NOTE: trustPolicy no-downgrade was tried and reverted — it blocks
# @govtech-bb/design and @govtech-bb/react@1.0.0-alpha.16, which were
# published without provenance attestation (earlier versions had it).
# Re-enable once the design-system publish pipeline attests again.
blockExoticSubdeps: true

# pnpm 11 prompts before purging node_modules; non-TTY contexts (Docker
# image builds, Amplify) abort instead of prompting. Restore v10 behavior.
confirmModulesPurge: false

# ponytail: Accept GHSA-w5hq-g745-h8pq for ExcelJS 4.4.0's uuid 8: it only
# calls v4(), unaffected by the v3/v5/v6 buffer bug. Reassess when ExcelJS
# or UUID callers change; direct UUID dependencies already require >=11.1.1.
# Remove each override when its parent accepts a patched release without it.
overrides:
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2 # @nestjs/swagger
  esbuild@<0.28.1: ^0.28.1 # @esbuild-kit/core-utils (via drizzle-kit)
  axios@>=1.0.0 <1.20.0: ^1.20.0 # nx pins 1.18.1
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12 # nx pins 5.0.8
  nx>smol-toml@<1.9.0: ^1.9.0 # nx 22 pins 1.6.1
  "@tailwindcss/typography>postcss-selector-parser@<7.1.6": ^7.1.6 # pins 6.0.10
  # ponytail: paired with the engine patch until gray-matter replaces js-yaml 3 and its vulnerable CLI deps.
  gray-matter@4.0.3>js-yaml: ^4.3.2

# pnpm blocks dependency build scripts by default; allowBuilds is the
# reviewed decision list. true = must run (fetch/verify native binaries).
# false = consciously blocked: telemetry/analytics postinstalls (@scarf,
# nestjs, protobufjs) or native modules with a working JS/WASM fallback
# (nx, unrs-resolver). A new dep with a build script stays blocked until
# reviewed and sorted here.
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true
  "@nestjs/core": false
  "@scarf/scarf": false
  nx: false
  protobufjs: false
  unrs-resolver: false

catalog:
  "@tanstack/ai": "^0.39.0"
  "@tanstack/ai-bedrock": "^0.1.0"
  "@tanstack/ai-react": "^0.16.1"
  "@tanstack/devtools-vite": "^0.7.0"
  "@tanstack/react-devtools": "^0.10.5"
  "@tanstack/react-form": "^1.29.0"
  "@tanstack/react-query": "^5.100.11"
  "@tanstack/react-query-devtools": "^5.100.11"
  "@tanstack/react-router": "^1.170.9"
  "@tanstack/react-router-devtools": "^1.167.0"
  "@tanstack/react-router-ssr-query": "^1.167.0"
  "@tanstack/react-start": "^1.168.16"
  "@tanstack/react-store": "^0.9.3"
  "@tanstack/react-virtual": "^3.13.26"
  "@tanstack/router-plugin": "^1.167.22"
  "@types/react": "^19.2.15"
  "@types/react-dom": "^19.2.3"
  react: "^19.2.6"
  react-dom: "^19.2.6"
  typescript: "^5.9.3"
  vite: "^8.0.14"

# Docker contexts install workspace subsets that may not use every patch.
allowUnusedPatches: true

patchedDependencies:
  "@tanstack/ai-bedrock@0.3.7": patches/@tanstack__ai-bedrock@0.3.7.patch
  "gray-matter@4.0.3": patches/gray-matter@4.0.3.patch
